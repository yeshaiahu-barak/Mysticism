<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טסטר גבולות וואטסאפ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; text-align: center; background: #f0f4f8; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { font-size: 20px; padding: 10px; width: 80%; margin-bottom: 20px; text-align: center; border: 2px solid #3498db; border-radius: 5px; }
        button { font-size: 18px; padding: 12px 20px; background: #25D366; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 80%; }
        button:hover { background: #128C7E; }
        p { color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h2>מעבדת בדיקות WhatsApp 🧪</h2>
        <p>הכנס את מספר התווים שתרצה לנסות להעביר ישירות לוואטסאפ, כדי למצוא את מגבלת המכשיר שלך:</p>
        
        <input type="number" id="charCount" value="2500" step="100">
        <br>
        <button onclick="testWhatsAppLimit()">נסה לשלוח עכשיו</button>
        
        <p id="result"></p>
    </div>

    <script>
        function testWhatsAppLimit() {
            // 1. לוקח את המספר שהוקלד
            const count = parseInt(document.getElementById('charCount').value, 10);
            
            if (isNaN(count) || count <= 0) {
                alert("אנא הכנס מספר חוקי");
                return;
            }

            // 2. מייצר אוטומטית טקסט אקראי באורך המדויק שביקשנו (שימוש באות א')
            const dummyText = 'א'.repeat(count);
            
            document.getElementById('result').innerText = `⏳ מנסה לדחוף ${count} תווים ל-URL...`;
            
            // 3. מנסה לפתוח את וואטסאפ
            try {
                window.location.href = `whatsapp://send?text=${encodeURIComponent(dummyText)}`;
                document.getElementById('result').innerText += `\n✅ הבקשה נשלחה. האם וואטסאפ נפתח עם הטקסט?`;
            } catch (err) {
                document.getElementById('result').innerText += `\n❌ שגיאת דפדפן - הגענו לגבול הזיכרון!`;
            }
        }
    </script>
</body>
</html>
