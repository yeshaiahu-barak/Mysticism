<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פאנל ניהול - סטטיסטיקות</title>
    
    <!-- ייבוא ספריית Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- חיבור לקובץ ההגדרות הקיים של הפרויקט -->
    <script src="config.js"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 20px; 
            color: #2c3e50; 
        }
        h1 { text-align: center; color: #34495e; margin-bottom: 30px; }
        
        .stats-container { 
            display: flex; 
            gap: 20px; 
            justify-content: center; 
            margin-bottom: 30px; 
            flex-wrap: wrap; 
        }
        .stat-card { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            text-align: center; 
            min-width: 180px; 
            border-top: 5px solid #3498db; 
        }
        .stat-card.deep { border-top-color: #f39c12; }
        .stat-card.basic { border-top-color: #2ecc71; }
        
        .stat-card h3 { margin: 0 0 10px 0; font-size: 1.1em; color: #7f8c8d; }
        .stat-card p { margin: 0; font-size: 2.5em; font-weight: bold; color: #2c3e50; }
        
        .table-container { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            overflow-x: auto; 
            max-width: 1000px;
            margin: 0 auto;
        }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 15px; border-bottom: 1px solid #ecf0f1; }
        th { background-color: #f8f9fa; color: #34495e; font-weight: bold; }
        tr:hover { background-color: #f1f4f6; }
        
        .loading { text-align: center; font-size: 1.2em; color: #3498db; margin-top: 50px; font-weight: bold; }
        
        .badge { padding: 5px 10px; border-radius: 12px; font-size: 0.85em; font-weight: bold; color: white; display: inline-block;}
        .badge.basic { background-color: #2ecc71; }
        .badge.deep { background-color: #f39c12; }
        
        .refresh-btn { 
            display: block; 
            margin: 0 auto 20px auto; 
            background-color: #34495e; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 6px; 
            font-size: 16px; 
            cursor: pointer; 
            transition: background 0.3s;
        }
        .refresh-btn:hover { background-color: #2c3e50; }
    </style>
</head>
<body>

    <h1>📊 פאנל ניהול וסטטיסטיקות - הדוח המיסטי</h1>
    
    <button class="refresh-btn" onclick="fetchData()">🔄 רענן נתונים</button>

    <div id="loadingMsg" class="loading">טוען נתונים ממסד הנתונים... נא להמתין.</div>

    <div class="stats-container" id="statsContainer" style="display: none;">
        <div class="stat-card">
            <h3>סה"כ דוחות שהופקו</h3>
            <p id="totalReports">0</p>
        </div>
        <div class="stat-card basic">
            <h3>דוחות בסיסיים</h3>
            <p id="basicReports">0</p>
        </div>
        <div class="stat-card deep">
            <h3>דוחות עמוקים (פרימיום)</h3>
            <p id="deepReports">0</p>
        </div>
    </div>

    <div class="table-container" id="tableContainer" style="display: none;">
        <table id="logsTable">
            <thead>
                <tr>
                    <th>תאריך ושעה</th>
                    <th>סוג פעולה</th>
                    <th>שם הלקוח</th>
                    <th>עיר</th>
                    <th>מספר טלפון</th>
                    <th>כתובת IP</th>
                </tr>
            </thead>
            <tbody>
                <!-- הנתונים יוזרקו לכאן דינמית -->
            </tbody>
        </table>
    </div>

    <script>
        async function fetchData() {
            // הצגת חיווי טעינה והסתרת התוכן הישן
            document.getElementById('loadingMsg').style.display = 'block';
            document.getElementById('statsContainer').style.display = 'none';
            document.getElementById('tableContainer').style.display = 'none';
            
            try {
                // משיכת כל הנתונים מטבלת reports_log ומיון מהחדש ביותר לישן ביותר
                const { data, error } = await supabaseClient
                    .from('reports_log')
                    .select('*')
                    .order('action_date', { ascending: false })
                    .order('action_time', { ascending: false });

                if (error) throw error;

                // הפעלת פונקציות העזר לבניית המסך
                renderStats(data);
                renderTable(data);
                
                // הסתרת הטעינה והצגת התוכן
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('statsContainer').style.display = 'flex';
                document.getElementById('tableContainer').style.display = 'block';
            } catch (err) {
                console.error("❌ שגיאה במשיכת נתונים מסופאבייס:", err);
                document.getElementById('loadingMsg').innerText = "אירעה שגיאה בטעינת הנתונים. אנא ודא שקובץ config.js תקין ושהחיבור פועל.";
                document.getElementById('loadingMsg').style.color = "red";
            }
        }

        // פונקציה לחישוב והצגת הכרטיסיות העליונות
        function renderStats(data) {
            if (!data) return;
            
            const total = data.length;
            const basic = data.filter(item => item.action_type === 'basic_report').length;
            const deep = data.filter(item => item.action_type === 'deep_report').length;

            document.getElementById('totalReports').innerText = total;
            document.getElementById('basicReports').innerText = basic;
            document.getElementById('deepReports').innerText = deep;
        }

        // פונקציה להזרקת הנתונים אל תוך טבלת ההיסטוריה
        function renderTable(data) {
            const tbody = document.querySelector('#logsTable tbody');
            tbody.innerHTML = ''; 
            
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">עדיין אין נתונים במערכת.</td></tr>';
                return;
            }

            data.forEach(log => {
                const tr = document.createElement('tr');
                
                // סידור יפה של התאריך והשעה
                const dateStr = log.action_date ? log.action_date.split('-').reverse().join('/') : '-';
                const timeStr = log.action_time ? log.action_time.substring(0, 5) : '-';
                
                // יצירת שם מלא
                const fullName = [log.first_name, log.last_name].filter(Boolean).join(' ') || 'לא הוזן';
                
                // תצוגת סוג הדוח כצבע (תגית)
                let badgeHtml = '-';
                if (log.action_type === 'basic_report') {
                    badgeHtml = '<span class="badge basic">בסיסי</span>';
                } else if (log.action_type === 'deep_report') {
                    badgeHtml = '<span class="badge deep">עמוק</span>';
                }
                
                // יצירת שורת הטבלה
                tr.innerHTML = `
                    <td dir="ltr" style="text-align: right;">${timeStr} &nbsp;|&nbsp; ${dateStr}</td>
                    <td>${badgeHtml}</td>
                    <td>${fullName}</td>
                    <td>${log.city || '-'}</td>
                    <td>${log.phone || '-'}</td>
                    <td dir="ltr" style="text-align: right; font-size: 0.9em; color: #7f8c8d;">${log.ip_address || '-'}</td>
                `;
                
                tbody.appendChild(tr);
            });
        }

        // הפעלת פונקציית המשיכה מיד כשדף האדמין עולה
        window.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
