<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מסך ניהול ראשי - סטטיסטיקות</title>
    
    <!-- טעינת ספריות קונפיגורציה -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }
        .stats-box {
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            margin: 30px 0;
            font-size: 20px;
            color: var(--primary-color);
            text-align: right;
        }
        .stats-total {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #bdc3c7;
            padding-bottom: 10px;
            text-align: center;
        }
        .action-breakdown {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .action-breakdown li {
            padding: 8px 0;
            border-bottom: 1px dashed #ccc;
            display: flex;
            justify-content: space-between;
        }
        .action-breakdown li:last-child {
            border-bottom: none;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .refresh-btn { background-color: #95a5a6; color: white; }
        .refresh-btn:hover { background-color: #7f8c8d; }
        .report-btn { background-color: var(--accent-color); color: white; }
        .report-btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <div class="container">
        <h1>פאנל ניהול ראשי</h1>

        <div class="stats-box">
            <div class="stats-total">
                סה"כ פעולות במערכת: <span id="totalRecordsCounter">טוען...</span>
            </div>
            <strong>חלוקה לפי סוגי פעולות:</strong>
            <ul id="actionBreakdownList" class="action-breakdown">
                <li>טוען נתונים...</li>
            </ul>
        </div>

        <div class="actions">
            <button class="refresh-btn" onclick="loadStatistics()">רענן נתונים</button>
            <button class="report-btn" onclick="openRawDataReport()">למעבר להפקת דוח מסונן (Raw Data)</button>
        </div>
    </div>

    <script>
        async function loadStatistics() {
            const counterElement = document.getElementById('totalRecordsCounter');
            const breakdownList = document.getElementById('actionBreakdownList');
            
            counterElement.innerText = "טוען...";
            breakdownList.innerHTML = "<li>טוען נתונים...</li>";

            try {
                // משיכת העמודה action_type מכל הרשומות כדי לחשב חלוקה
                const { data, error } = await supabaseClient
                    .from('reports_log')
                    .select('action_type');

                if (error) throw error;

                // עדכון סך הכל
                counterElement.innerText = data.length;

                // חישוב החלוקה לפי סוג הפעולה
                const actionCounts = {};
                data.forEach(row => {
                    const type = row.action_type || 'לא ידוע';
                    actionCounts[type] = (actionCounts[type] || 0) + 1;
                });

                // ציור החלוקה על המסך
                breakdownList.innerHTML = '';
                
                if (Object.keys(actionCounts).length === 0) {
                    breakdownList.innerHTML = "<li>אין נתונים במערכת.</li>";
                } else {
                    for (const [action, count] of Object.entries(actionCounts)) {
                        const li = document.createElement('li');
                        li.innerHTML = `<span>${action}</span> <strong>${count}</strong>`;
                        breakdownList.appendChild(li);
                    }
                }

            } catch (err) {
                console.error("שגיאה בטעינת סטטיסטיקות:", err);
                counterElement.innerText = "שגיאה בטעינה";
                breakdownList.innerHTML = "<li>שגיאה בטעינת החלוקה.</li>";
            }
        }

        function openRawDataReport() {
            window.location.href = 'rawdata.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadStatistics();
        });
    </script>
</body>
</html>
