<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול מאובטח - האפליקציה המיסטית</title>
    
    <!-- ספרית Supabase וקובץ ההגדרות המרכזי -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    
    <style>
        :root {
            --primary-color: #2980b9;
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --bg-color: #ecf0f1;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); padding: 40px; color: var(--text-color); }
        .dashboard-container, .login-container { max-width: 800px; margin: auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* מסך התחברות */
        .login-container { max-width: 400px; text-align: center; margin-top: 50px; }
        .login-container h2 { color: var(--primary-color); margin-bottom: 20px; }
        .login-container input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #bdc3c7; border-radius: 6px; font-size: 16px; text-align: center; box-sizing: border-box; }
        .login-btn { width: 100%; background-color: #34495e; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; transition: background 0.3s;}
        .login-btn:hover { background-color: #2c3e50; }
        .error-msg { color: #e74c3c; margin-bottom: 15px; display: none; font-weight: bold; }

        #dashboardWrapper { display: none; }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 30px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #ddd; }
        th { background-color: var(--primary-color); color: white; font-size: 1.1em; }
        tr:hover { background-color: #f5f7fa; }
        
        .buttons-row { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        .action-btn { color: white; padding: 10px 20px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; width: 250px; font-weight: bold; transition: opacity 0.3s;}
        .action-btn:hover { opacity: 0.9; }
        .refresh-btn { background-color: var(--success-color); }
        .excel-btn { background-color: var(--warning-color); }
        
        #loading { text-align: center; font-weight: bold; color: #7f8c8d; display: none; margin-bottom: 15px;}
    </style>
</head>
<body>

    <!-- מסך שער התחברות -->
    <div class="login-container" id="loginWrapper">
        <h2>🔒 כניסת מנהל מערכת</h2>
        <div class="error-msg" id="loginError">שם משתמש או סיסמה שגויים.</div>
        <input type="text" id="usernameInput" placeholder="שם משתמש" autocomplete="off">
        <input type="password" id="passwordInput" placeholder="סיסמה">
        <button class="login-btn" onclick="attemptLogin()">היכנס</button>
    </div>

    <!-- לוח הבקרה הניהולי -->
    <div id="dashboardWrapper">
        <div class="dashboard-container">
            <h1>📊 סטטיסטיקות שימוש - האפליקציה המיסטית</h1>
            
            <div class="buttons-row">
                <button class="action-btn refresh-btn" onclick="fetchStats()">🔄 רענן נתונים</button>
                <button class="action-btn excel-btn" onclick="exportDynamicCSV()">📥 ייצוא דוח מלא דינמי (CSV)</button>
            </div>
            
            <div id="loading">מעבד נתונים מול השרת...</div>

            <table>
                <thead>
                    <tr>
                        <th>סוג הפעולה</th>
                        <th>כמות לחיצות כוללת</th>
                        <th>תאריך לחיצה אחרונה</th>
                    </tr>
                </thead>
                <tbody id="statsBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        /* ==========================================================================
           1. הגדרות ופרטי אימות מנהל
           ========================================================================== */
        const ADMIN_USER = 'admin';
        const ADMIN_PASS = '1234';

        const actionTranslations = {
            'basic_report': 'הפקת דוח בסיסי',
            'deep_report': 'הפקת דוח עמוק',
            'whatsapp_share': 'שיתוף לוואטסאפ',
            'pdf_download': 'הורדת קובץ PDF'
        };

        const headerTranslations = {
            'created_at': 'תאריך ושעה',
            'action_type': 'סוג פעולה',
            'first_name': 'שם פרטי',
            'middle_name': 'שם פרטי נוסף',
            'last_name': 'שם משפחה',
            'extra_last_name': 'שם משפחה נוסף',
            'phone': 'טלפון',
            'id_number': 'תעודת זהות',
            'city': 'עיר',
            'birth_date': 'תאריך לידה',
            'birth_time': 'שעת לידה',
            'ip_address': 'כתובת IP',
            'device_info': 'פרטי מכשיר'
        };

        /* ==========================================================================
           2. ניהול כניסה למערכת הניהול
           ========================================================================== */
        function attemptLogin() {
            const user = document.getElementById('usernameInput').value;
            const pass = document.getElementById('passwordInput').value;

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                document.getElementById('loginWrapper').style.display = 'none';
                document.getElementById('dashboardWrapper').style.display = 'block';
                fetchStats();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        /* ==========================================================================
           3. שליפת נתונים סטטיסטיים וייצוא קבצים
           ========================================================================== */
        async function fetchStats() {
            toggleLoading(true, 'טוען סטטיסטיקות מהשרת...');
            try {
                // קריאה לפונקציית השרת המאובטחת
                const { data, error } = await supabaseClient.rpc('get_log_stats');
                if (error) throw error;

                let html = '';
                if (data && data.length > 0) {
                    data.forEach(row => {
                        let dateStr = new Date(row.last_action).toLocaleString('he-IL');
                        let name = actionTranslations[row.action] || row.action;
                        html += `<tr><td><strong>${name}</strong></td><td>${row.total_clicks}</td><td>${dateStr}</td></tr>`;
                    });
                } else {
                    html = '<tr><td colspan="3" style="text-align: center;">אין נתונים בלוג.</td></tr>';
                }
                document.getElementById('statsBody').innerHTML = html;
            } catch (err) {
                console.error("שגיאה במשיכת סטטיסטיקות:", err);
                alert("שגיאה במשיכת נתונים מהשרת. בדוק את הקונסולה.");
            } finally {
                toggleLoading(false);
            }
        }

        async function exportDynamicCSV() {
            toggleLoading(true, 'מכין קובץ דינמי לייצוא...');
            try {
                const { data, error } = await supabaseClient.rpc('get_full_log');
                if (error) throw error;

                if (data && data.length > 0) {
                    let csv = "\uFEFF";
                    let columns = Object.keys(data[0]);
                    let headers = columns.map(c => headerTranslations[c] || c);
                    csv += headers.join(",") + "\n";

                    data.forEach(row => {
                        let rowVals = columns.map(col => {
                            let val = row[col];
                            if (col === 'created_at' && val) val = new Date(val).toLocaleString('he-IL');
                            else if (col === 'action_type' && val) val = actionTranslations[val] || val;
                            return `"${String(val ?? '').replace(/"/g, '""')}"`;
                        });
                        csv += rowVals.join(",") + "\n";
                    });

                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement("a");
                    link.href = URL.createObjectURL(blob);
                    link.download = "דוח_מיסטי_מלא_דינמי.csv";
                    link.click();
                } else {
                    alert("אין נתונים לייצוא.");
                }
            } catch (err) {
                console.error("שגיאה בייצוא:", err);
                alert("שגיאה בהכנת קובץ הייצוא.");
            } finally {
                toggleLoading(false);
            }
        }

        function toggleLoading(show, text = 'מעבד נתונים מול השרת...') {
            const el = document.getElementById('loading');
            el.innerText = text;
            el.style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
