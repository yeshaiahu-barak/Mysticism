<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <title>מערכת בקרה - דוחות מיסטיקה</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        /* עיצוב מערכת ניהול - נקי, רשמי ומופרד מעיצוב הלקוח */
        :root { --admin-primary: #2c3e50; --admin-action: #f39c12; --admin-export: #27ae60; --bg: #ecf0f1; }
        body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: auto; background: #fff; padding: 25px; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        #loginView, #unauthView, #adminView { display: none; }
        .auth-card { max-width: 400px; text-align: center; margin: 100px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--admin-primary); padding-bottom: 15px; margin-bottom: 25px; }
        .header-actions { display: flex; gap: 10px; }
        
        button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        .btn-refresh { background: var(--admin-action); }
        .btn-export { background: var(--admin-export); }
        .btn-logout { background: #e74c3c; }
        
        .filters { display: flex; gap: 15px; background: #f8f9fa; padding: 15px; border-radius: 4px; margin-bottom: 20px; align-items: flex-end; }
        .filters input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: right; white-space: nowrap; font-size: 14px; }
        th { background: var(--admin-primary); color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
    </style>
</head>
<body>

    <!-- [QA Note]: מנגנון הרשאות קפדני למניעת גישה לא מורשית. -->
    <div id="loginView" class="auth-card">
        <h2>כניסת הנהלה</h2>
        <button onclick="supabaseClient.auth.signInWithOAuth({provider: 'google'})" style="background:#4285F4; width:100%; padding:12px;">התחבר עם Google</button>
    </div>

    <div id="unauthView" class="auth-card">
        <h2 style="color:red;">גישה נדחתה</h2>
        <p>אין לך הרשאה למסך זה.</p>
        <button class="btn-logout" onclick="supabaseClient.auth.signOut()">חזור</button>
    </div>

    <div id="adminView" class="container">
        <div class="header">
            <h2>מערכת בקרה ונתונים</h2>
            <div class="header-actions">
                <button class="btn-refresh" onclick="generateReport()">רענן נתונים</button>
                <button class="btn-logout" onclick="supabaseClient.auth.signOut()">יציאה</button>
            </div>
        </div>

        <div class="filters">
            <div><label>מ:</label><br><input type="datetime-local" id="fromDate"></div>
            <div><label>עד:</label><br><input type="datetime-local" id="toDate"></div>
            <button style="background:var(--admin-primary)" onclick="generateReport()">סנן</button>
            <button class="btn-export" onclick="exportToCSV()">ייצא לאקסל (CSV)</button>
        </div>

        <div style="overflow-x: auto;">
            <table>
                <thead id="tHead"></thead>
                <tbody id="tBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // ==========================================
        // MODULE: Auth & Security
        // ==========================================
        const AUTHORIZED_EMAIL = '4990920@gmail.com'; // Hardcoded Security Constraint
        let globalDataCache = [];

        supabaseClient.auth.onAuthStateChange((event, session) => {
            document.querySelectorAll('#loginView, #unauthView, #adminView').forEach(el => el.style.display = 'none');
            if (!session) document.getElementById('loginView').style.display = 'block';
            else if (session.user.email === AUTHORIZED_EMAIL) {
                document.getElementById('adminView').style.display = 'block';
                initDates(); generateReport();
            } 
            else document.getElementById('unauthView').style.display = 'block';
        });

        // ==========================================
        // MODULE: Data Fetching & UI
        // ==========================================
        const colDict = { 'id':'מפתח','created_at':'זמן מערכת','action_date':'תאריך הזנה','action_time':'שעת הזנה','first_name':'שם פרטי','last_name':'משפחה','phone':'טלפון','birth_date':'תאריך לידה' };
        
        function initDates() {
            let d = new Date(); d.setHours(23,59,59); document.getElementById('toDate').value = d.toISOString().slice(0,16);
            d.setDate(d.getDate() - 30); d.setHours(0,0,0); document.getElementById('fromDate').value = d.toISOString().slice(0,16);
        }

        /* [Maintainer Note]: פונקציה זו טוענת את המידע ומציגה רק עמודות ספציפיות במסך. 
           המידע המלא (globalDataCache) נשמר בזיכרון לטובת ייצוא ה-CSV. */
        async function generateReport() {
            const f = new Date(document.getElementById('fromDate').value).toISOString();
            const t = new Date(document.getElementById('toDate').value).toISOString();
            
            const { data, error } = await supabaseClient.from('reports_log').select('*').gte('created_at', f).lte('created_at', t).order('id', {ascending: false});
            if (error) return alert("שגיאה במשיכת נתונים.");
            globalDataCache = data || [];
            
            const screenCols = ['id', 'action_date', 'action_time', 'first_name', 'last_name', 'phone', 'birth_date'];
            
            document.getElementById('tHead').innerHTML = `<tr>${screenCols.map(c => `<th>${colDict[c] || c}</th>`).join('')}</tr>`;
            document.getElementById('tBody').innerHTML = globalDataCache.map(row => 
                `<tr>${screenCols.map(c => {
                    let v = row[c] || '-';
                    let isNum = ['id', 'action_date', 'action_time', 'phone', 'birth_date'].includes(c);
                    return `<td ${isNum ? 'dir="ltr"' : ''}>${v}</td>`;
                }).join('')}</tr>`
            ).join('') || '<tr><td colspan="7" style="text-align:center;">אין נתונים</td></tr>';
        }

        function exportToCSV() {
            if (!globalDataCache.length) return alert("אין נתונים.");
            const keys = Object.keys(globalDataCache[0]);
            let csv = "\uFEFF" + keys.map(k => colDict[k] || k).join(",") + "\n";
            globalDataCache.forEach(row => { csv += keys.map(k => `"${(row[k] || '').toString().replace(/"/g, '""')}"`).join(",") + "\n"; });
            
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
            a.download = `Report_${Date.now()}.csv`;
            a.click();
        }
    </script>
</body>
</html>
