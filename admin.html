<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מסך ניהול ראשי - סטטיסטיקות</title>
    
    <!-- טעינת ספריות קונפיגורציה -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }
        .stats-box {
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            margin: 30px 0;
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .refresh-btn {
            background-color: #95a5a6;
            color: white;
        }
        .refresh-btn:hover { background-color: #7f8c8d; }
        
        .report-btn {
            background-color: var(--accent-color);
            color: white;
        }
        .report-btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <div class="container">
        <h1>פאנל ניהול ראשי</h1>

        <div class="stats-box">
            סה"כ רשומות במערכת: <span id="totalRecordsCounter">טוען...</span>
        </div>

        <div class="actions">
            <!-- כפתור הרענון מפעיל פונקציה שמעדכנת את הסטטיסטיקה במסך -->
            <button class="refresh-btn" onclick="loadStatistics()">רענן נתונים</button>
            
            <!-- כפתור הדוח פשוט מעביר את המשתמש לקובץ השני -->
            <button class="report-btn" onclick="openRawDataReport()">הפק דוח (Raw Data)</button>
        </div>
    </div>

    <script>
        // פונקציה לטעינת סטטיסטיקות ממסד הנתונים
        async function loadStatistics() {
            const counterElement = document.getElementById('totalRecordsCounter');
            counterElement.innerText = "טוען...";

            try {
                // בקשה ל-Supabase לספור את כמות הרשומות בטבלה
                const { count, error } = await supabaseClient
                    .from('reports_log')
                    .select('*', { count: 'exact', head: true });

                if (error) throw error;

                counterElement.innerText = count;
            } catch (err) {
                console.error("שגיאה בטעינת סטטיסטיקות:", err);
                counterElement.innerText = "שגיאה בטעינה";
            }
        }

        // פונקציה לניווט לדף הדוחות
        function openRawDataReport() {
            // מעביר את הדפדפן לקובץ rawdata.html
            window.location.href = 'rawdata.html';
        }

        // טעינת הסטטיסטיקות מיד כשהדף עולה
        window.addEventListener('DOMContentLoaded', () => {
            loadStatistics();
        });
    </script>
</body>
</html>
