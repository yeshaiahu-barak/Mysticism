<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- פקודות למניעת שמירה בזיכרון המטמון (Cache) כדי שהגרסה העדכנית תמיד תוצג -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>מסך ניהול מאובטח - דוחות מיסטיקה</title>
    
    <!-- טעינת ספריות קונפיגורציה -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --danger-color: #e74c3c;
            --google-color: #4285F4;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        /* הסתרת אזורים כברירת מחדל עד לבדיקת זיהוי */
        #loginView, #unauthView, #adminView {
            display: none;
        }

        h1 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .header-top h1 {
            border: none;
            padding: 0;
            margin: 0;
        }

        /* אזור הכפתורים - ממוקם עכשיו עליונה ומוגדר נכון */
        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px; 
        }

        .stats-box {
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            font-size: 20px;
            color: var(--primary-color);
            text-align: right;
        }
        .stats-total {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .breakdown-title {
            font-weight: bold;
            font-size: 22px;
            margin-bottom: 15px;
            color: var(--primary-color);
            text-align: center;
            text-decoration: underline;
        }

        .action-breakdown {
            list-style-type: none;
            padding: 0;
            margin: 0;
            max-width: 400px;
            margin: 0 auto;
        }
        .action-breakdown li {
            padding: 10px 0;
            border-bottom: 1px dashed #bdc3c7;
            display: flex;
            justify-content: space-between;
        }
        .action-breakdown li:last-child { border-bottom: none; }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            color: white;
        }
        .google-btn { background-color: var(--google-color); margin-top: 20px; }
        .google-btn:hover { background-color: #357abd; }
        .refresh-btn { background-color: #95a5a6; }
        .refresh-btn:hover { background-color: #7f8c8d; }
        .report-btn { background-color: var(--accent-color); }
        .report-btn:hover { background-color: #2980b9; }
        .logout-btn { background-color: var(--danger-color); font-size: 14px; padding: 8px 15px; }
        .logout-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <!-- מצב 1: מסך התחברות -->
    <div id="loginView" class="container">
        <h1>כניסת מנהל</h1>
        <p>מערכת הניהול מאובטחת. אנא התחבר עם חשבון Google מורשה כדי להמשיך.</p>
        <button class="google-btn" onclick="signInWithGoogle()">התחבר באמצעות Google</button>
    </div>

    <!-- מצב 2: משתמש מחובר אך אינו מורשה -->
    <div id="unauthView" class="container">
        <h1 style="color: var(--danger-color); border-color: var(--danger-color);">גישה נדחתה</h1>
        <p>חשבון ה-Google שאיתו התחברת אינו מורשה לגשת למסך זה.</p>
        <p><strong>גישה מותרת לכתובת: 4990920@gmail.com בלבד.</strong></p>
        <button class="logout-btn" onclick="signOut()" style="margin-top: 20px;">התנתק וחזור להתחברות</button>
    </div>

    <!-- מצב 3: פאנל ניהול (יוצג רק למייל המורשה) -->
    <div id="adminView" class="container">
        <div class="header-top">
            <h1>פאנל ניהול ראשי</h1>
            <button class="logout-btn" onclick="signOut()">יציאה מהמערכת</button>
        </div>

        <!-- אזור הכפתורים נמצא כאן בקוד, מיד מתחת לכותרת ומעל לסטטיסטיקה -->
        <div class="actions">
            <button class="refresh-btn" onclick="loadStatistics()">רענן נתונים</button>
            <button class="report-btn" onclick="openRawDataReport()">מעבר להפקת דוח מסונן (Raw Data)</button>
        </div>

        <!-- קופסת הסטטיסטיקות נמצאת מתחת לכפתורים -->
        <div class="stats-box">
            <div class="stats-total">
                סה"כ פעולות במערכת: <span id="totalRecordsCounter">טוען...</span>
            </div>
            
            <div class="breakdown-title">פירוט חלוקה לפי סוגי פעולות:</div>
            
            <ul id="actionBreakdownList" class="action-breakdown">
                <li>טוען נתונים...</li>
            </ul>
        </div>
    </div>

    <script>
        // 1. הגדרות אבטחה ותרגום
        const AUTHORIZED_EMAIL = '4990920@gmail.com';
        
        // מילון תרגום מאנגלית לעברית (לפי שמות הכפתורים במסך הראשי)
        const actionTranslations = {
            'basic_report': 'הפק דוח בסיסי',
            'deep_report': 'הפק דוח עמוק',
            'whatsapp_share': 'שלח דוח לוואטסאפ',
            'pdf_download': 'הורד דוח כ-PDF'
        };

        // 2. מנגנון האבטחה (Auth)
        async function checkAuthStatus() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            routeUser(session);
        }

        // האזנה אקטיבית לשינויים בהתחברות
        supabaseClient.auth.onAuthStateChange((event, session) => {
            routeUser(session);
        });

        function routeUser(session) {
            // הסתרת כל המסכים
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('unauthView').style.display = 'none';
            document.getElementById('adminView').style.display = 'none';

            if (!session) {
                // המשתמש לא מחובר כלל
                document.getElementById('loginView').style.display = 'block';
            } else {
                // המשתמש מחובר - בודקים את כתובת האימייל שלו
                const userEmail = session.user.email;
                if (userEmail === AUTHORIZED_EMAIL) {
                    document.getElementById('adminView').style.display = 'block';
                    loadStatistics(); // טוענים את הנתונים רק אחרי שווידאנו הרשאה
                } else {
                    document.getElementById('unauthView').style.display = 'block';
                }
            }
        }

        async function signInWithGoogle() {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.href // חזרה לדף הזה אחרי ההתחברות
                }
            });
            if (error) {
                alert("שגיאה בהתחברות ל-Google: " + error.message);
            }
        }

        async function signOut() {
            await supabaseClient.auth.signOut();
        }

        // 3. פונקציות הסטטיסטיקה של הניהול
        async function loadStatistics() {
            const counterElement = document.getElementById('totalRecordsCounter');
            const breakdownList = document.getElementById('actionBreakdownList');
            
            counterElement.innerText = "טוען...";
            breakdownList.innerHTML = "<li>טוען נתונים...</li>";

            try {
                const { data, error } = await supabaseClient
                    .from('reports_log')
                    .select('action_type');

                if (error) throw error;

                // עדכון סך הכל
                counterElement.innerText = data.length;

                // חישוב החלוקה לפי סוג הפעולה
                const actionCounts = {};
                data.forEach(row => {
                    const type = row.action_type || 'לא ידוע';
                    actionCounts[type] = (actionCounts[type] || 0) + 1;
                });

                breakdownList.innerHTML = '';
                
                if (Object.keys(actionCounts).length === 0) {
                    breakdownList.innerHTML = "<li>אין נתונים במערכת.</li>";
                } else {
                    for (const [actionKey, count] of Object.entries(actionCounts)) {
                        const li = document.createElement('li');
                        const translatedName = actionTranslations[actionKey] || actionKey;
                        li.innerHTML = `<span>${translatedName}</span> <strong>${count}</strong>`;
                        breakdownList.appendChild(li);
                    }
                }

            } catch (err) {
                console.error("שגיאה בטעינת סטטיסטיקות:", err);
                counterElement.innerText = "שגיאה בטעינה";
                breakdownList.innerHTML = "<li>שגיאה בטעינת החלוקה.</li>";
            }
        }

        function openRawDataReport() {
            window.location.href = 'rawdata.html';
        }

        // הפעלת בדיקת האבטחה מיד כשהדף עולה
        window.addEventListener('DOMContentLoaded', () => {
            checkAuthStatus();
        });
    </script>
</body>
</html>
