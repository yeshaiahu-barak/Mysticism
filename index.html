<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הדוח המיסטי שלי</title>
    
    <!-- [QA Note]: ספריות חיצוניות נטענות דרך CDN מאובטח. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    
    <style>
        /* [Maintainer Note]: שימוש במשתני CSS מאפשר שינוי עיצוב גלובלי (Theming) בקלות. */
        :root {
            --primary-color: #3498db; --primary-dark: #2980b9;
            --accent-color: #f39c12; --accent-dark: #d68910;
            --bg-color: #f0f4f8; --card-bg: #ffffff;
            --text-color: #2c3e50; --border-color: #ccd1d9;
            --danger-color: #e74c3c; --success-color: #25D366;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); padding: 20px; line-height: 1.6; color: var(--text-color); }
        .container { max-width: 850px; margin: auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { text-align: center; color: var(--text-color); }
        
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; margin-bottom: 0; min-width: 0; position: relative; } 
        @media (max-width: 600px) { .form-row { flex-direction: column; gap: 15px; } }

        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary-color); font-size: 0.95em; transform: translateX(-2ch); }
        input { width: 100%; height: 38px; padding: 6px 12px; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 6px; font-size: 15px; text-align: right; transition: all 0.3s; }
        input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 8px rgba(52, 152, 219, 0.3); }

        .suggestions-box { position: absolute; top: 100%; right: 0; left: 0; background: #ffffff; border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 6px 6px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); z-index: 1000; max-height: 150px; overflow-y: auto; display: none; }
        .suggestion-item { padding: 8px 12px; cursor: pointer; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
        .suggestion-item:hover { background-color: #ebf5fb; color: var(--primary-dark); }
        
        .action-buttons-top, .actions { display: flex; gap: 15px; margin-top: 25px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; color: white; transition: background 0.3s; }
        .main-btn { background-color: var(--primary-color); font-size: 18px; }
        .main-btn:hover { background-color: var(--primary-dark); }
        .main-btn:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .premium-btn { background-color: var(--accent-color); font-size: 18px; }
        .premium-btn:hover { background-color: var(--accent-dark); }
        .whatsapp-btn { background-color: var(--success-color); }
        .pdf-btn { background-color: var(--danger-color); }
        
        #results { margin-top: 30px; display: none; }
        #contentToPrint { background-color: var(--card-bg); padding: 20px; border: 2px solid #ecf0f1; border-radius: 8px; }
        .result-item { background: #f7fbfe; padding: 15px; margin-bottom: 12px; border-radius: 6px; border-right: 5px solid #85c1e9; }
        .result-item h4 { margin: 0 0 8px 0; font-size: 1.1em; color: var(--text-color); }
        .result-item p { margin: 0 0 5px 0; color: #333; text-align: justify; }
        .light-text { color: #555 !important; }
        
        #loadingMsg { display: none; text-align: center; color: var(--primary-color); font-weight: bold; margin-top: 15px; font-size: 1.1em; }
        #networkStatus { text-align: center; font-size: 0.9em; padding: 5px; margin-bottom: 15px; border-radius: 4px; display: none; }
        .status-offline { background-color: #f8d7da; color: #721c24; display: block !important; }

        @media print {
            body { background-color: white; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            .form-row, h1, .action-buttons-top, .actions, #loadingMsg, #networkStatus { display: none !important; }
            #results { display: block !important; border: none; margin: 0; padding: 0; }
            #contentToPrint { border: none; padding: 0; }
            .result-item { page-break-inside: avoid; border-right: 4px solid black; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="networkStatus">מצב אופליין: הפעולות נשמרות מקומית. חיבורי API מושבתים זמנית.</div>
        
        <h1>הדוח המיסטי שלי</h1>
        
        <div class="form-row">
            <div class="form-group"><label>שם פרטי (חובה):</label><input type="text" id="firstName" autocomplete="given-name"></div>
            <div class="form-group"><label>שם פרטי נוסף (לא חובה):</label><input type="text" id="middleName" autocomplete="additional-name"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>שם משפחה (חובה):</label><input type="text" id="lastName" autocomplete="family-name"></div>
            <div class="form-group"><label>שם משפחה נוסף (לא חובה):</label><input type="text" id="extraLastName" autocomplete="off"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>מספר טלפון נייד (חובה):</label><input type="tel" id="phone" autocomplete="tel"></div>
            <div class="form-group"><label>מספר תעודת זהות (לא חובה):</label><input type="text" id="idNumber" autocomplete="off"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>תאריך לידה (חובה):</label><input type="date" id="birthDate" autocomplete="bday"></div>
            <div class="form-group"><label>שעת לידה (24 שעות):</label><input type="time" id="birthTime" value="12:00"></div>
            <div class="form-group">
                <label>עיר לידה (לא חובה):</label>
                <input type="text" id="city" value="ירושלים" autocomplete="off" oninput="fetchCitySuggestions(this.value)">
                <div id="citySuggestionsBox" class="suggestions-box"></div>
            </div>
        </div>

        <div class="action-buttons-top">
            <button id="calcBtn" class="main-btn" onclick="handleUserAction('basic_report')">הפק דוח בסיסי</button>
            <button class="premium-btn" onclick="alert('בפיתוח')">הפק דוח עמוק</button>
        </div>
        
        <div id="loadingMsg">מעבד נתונים מול כוכבי השמיים ומאגרי התאריכים... נא להמתין...</div>

        <div id="results">
            <div id="contentToPrint">
                <h2><span id="resName"></span> - דוח מיסטי</h2>
                <div class="result-section"><div id="resAstro"></div></div>
                <div class="result-section"><div id="resNamesNum"></div></div>
            </div>
            <div class="actions">
                <button class="whatsapp-btn" onclick="handleUserAction('whatsapp_share')">שלח דוח לוואטסאפ</button>
                <button class="pdf-btn" onclick="handleUserAction('pdf_download')">הורד דוח כ-PDF</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // MODULE: Configuration & Security
        // ==========================================
        
        /* [QA Note]: פונקציות סניטציה קריטיות למניעת הזרקת קוד (XSS). 
           חובה להעביר כל קלט משתמש דרכן לפני הדפסה למסך. */
        const Security = {
            escapeHTML: (str) => {
                if (!str) return '';
                return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
            },
            sanitizeDigits: (str) => str ? str.replace(/\D/g, '') : '',
            sanitizeHebrew: (str) => str ? str.replace(/[^\u0590-\u05FF\s'-]/g, '') : ''
        };

        // מילוני בסיס לאופליין / Fallback
        const Dictionary = {
            gematria: {'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10,'כ':20,'ך':20,'ל':30,'מ':40,'ם':40,'נ':50,'ן':50,'ס':60,'ע':70,'פ':80,'ף':80,'צ':90,'ץ':90,'ק':100,'ר':200,'ש':300,'ת':400},
            numerology: {
                1: "מנהיגות מולדת, עצמאות וכוח רצון עז. אנשי ה-1 הם חלוצים, יזמים ובעלי ביטחון עצמי גבוה.",
                2: "זוגיות, שותפות, דיפלומטיה ורגישות רגשית גבוהה. מגשרים טבעיים השואפים להרמוניה.",
                3: "ביטוי עצמי, יצירתיות, שמחת חיים וכריזמה מתפרצת. תקשורתיים ואופטימיים.",
                4: "יציבות, סדר, משמעת קפדנית ועבודה קשה. הבסיס האיתן שאפשר לסמוך עליו.",
                5: "חופש, הרפתקנות, תנועה מתמדת ושינויים. זקוקים למרחב נשימה ענק וגיוון.",
                6: "האהבה, המשפחתיות, ההרמוניה והשירות המסור לזולת. המטפלים והמגוננים.",
                7: "רוחניות, העמקה, חשיבה חקרנית ואינטואיציה חדה כתער. הוגי דעות וחוקרים.",
                8: "עוצמה, סמכות, שפע חומרי, סטאטוס והישגיות בקנה מידה גדול.",
                9: "הומניטריות, נתינה אוניברסלית ללא תנאי, אצילות נפש וסיום מעגלים."
            },
            zodiac: [
                { name: "טלה", desc: "מזל אש דינמי ויצרי. פורץ דרך, אמיץ ומוביל." },
                { name: "שור", desc: "מזל אדמה יציב ופרקטי. נאמן, חושני ואמין כסלע." },
                { name: "תאומים", desc: "מזל אוויר אינטלקטואלי ומהיר תפיסה. סקרן ותקשורתי." },
                { name: "סרטן", desc: "מזל מים רגשי, משפחתי ועמוק בעל אינטואיציה חזקה." },
                { name: "אריה", desc: "מזל אש מלכותי וזורח. כריזמטי, נדיב ובעל לב ענק." },
                { name: "בתולה", desc: "מזל אדמה מאורגן, אנליטי ויורד לפרטים הקטנים." },
                { name: "מאזניים", desc: "מזל אוויר אסתטי, דיפלומטי ושואף להרמוניה וצדק." },
                { name: "עקרב", desc: "מזל מים אינטנסיבי, מגנטי ובעל עוצמה נפשית אדירה." },
                { name: "קשת", desc: "מזל אש אופטימי, פילוסופי וחובב חופש והרפתקאות." },
                { name: "גדי", desc: "מזל אדמה שאפתן, מעשי, בוגר ואחראי לטווח רחוק." },
                { name: "דלי", desc: "מזל אוויר מקורי, אינדיבידואליסט והומניטרי." },
                { name: "דגים", desc: "מזל מים רוחני, חומל, אמנותי ובעל דמיון עשיר." }
            ],
            ascendant: {
                "טלה": "חזות נמרצת, ישירה ומהירה.", "שור": "נוכחות רגועה ויציבה.", "תאומים": "אנרגיה קלילה ותקשורתית.", "סרטן": "הילה רכה ואמפתית.", "אריה": "נוכחות כריזמטית.", "בתולה": "חזות מאורגנת ואנליטית.", "מאזניים": "קסם אישי ודיפלומטיה.", "עקרב": "מבט חודר ומסתוריות.", "קשת": "אופטימיות ופתיחות.", "גדי": "רושם סמכותי ובוגר.", "דלי": "מקוריות וחדשנות.", "דגים": "עדינות ורוחניות."
            }
        };

        // ==========================================
        // MODULE: Calculators (Pure Functions)
        // ==========================================
        const Calculators = {
            gematria: (word) => word ? word.split('').reduce((sum, char) => sum + (Dictionary.gematria[char] || 0), 0) : 0,
            numerology: (num) => {
                if (!num) return 0;
                let sum = num;
                while (sum > 9) sum = String(sum).split('').reduce((acc, val) => acc + parseInt(val), 0);
                return sum;
            },
            sumDigits: (str) => Security.sanitizeDigits(str).split('').reduce((acc, val) => acc + parseInt(val), 0),
            getZodiacIndex: (d, m) => {
                const boundaries = [19, 18, 20, 19, 20, 20, 22, 22, 22, 22, 21, 21];
                let sign = m - 1;
                if (d > boundaries[sign]) sign = (sign + 1) % 12;
                // התאמת אינדקס כדי שטלה יהיה ראשון (מרץ 21)
                return (sign + 9) % 12; 
            },
            getAscendant: (sunIndex, timeStr) => {
                let [h, m] = timeStr.split(":");
                let decimalTime = parseInt(h) + (parseInt(m) / 60);
                let diff = decimalTime - 6;
                if (diff < 0) diff += 24;
                return Dictionary.zodiac[(sunIndex + Math.floor(diff / 2)) % 12].name;
            }
        };

        // ==========================================
        // MODULE: API & Data Managers
        // ==========================================
        
        /* [Maintainer Note]: פונקציה זו טוענת טקסטים דינמיים מטבלת dynamic_texts במסד הנתונים. */
        async function fetchDynamicTexts() {
            if (!navigator.onLine || typeof supabaseClient === 'undefined') return;
            try {
                const { data, error } = await supabaseClient.from('dynamic_texts').select('category, item_key, content');
                if (!error && data) {
                    data.forEach(item => {
                        if (item.category === 'numerology' || item.category === 'נומרולוגיה') Dictionary.numerology[item.item_key] = item.content;
                        else if (item.category === 'zodiac' || item.category === 'מזלות') {
                            let z = Dictionary.zodiac.find(z => z.name === item.item_key);
                            if (z) z.desc = item.content;
                        }
                        else if (item.category === 'ascendant' || item.category === 'אופק') Dictionary.ascendant[item.item_key] = item.content;
                    });
                }
            } catch (err) { console.warn("Fallback to local dict."); }
        }

        // ניהול תור (Debounce) עבור חיפוש עיר למניעת עומס API
        let cityTimeout = null;
        async function fetchCitySuggestions(query) {
            const box = document.getElementById('citySuggestionsBox');
            if (!query || query.length < 2 || !navigator.onLine) return box.style.display = 'none';
            
            clearTimeout(cityTimeout);
            cityTimeout = setTimeout(async () => {
                try {
                    let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`);
                    let data = await res.json();
                    box.innerHTML = '';
                    if (data.length > 0) {
                        data.forEach(item => {
                            let cityName = item.display_name.split(',')[0];
                            let div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.innerText = cityName;
                            div.onclick = () => { document.getElementById('city').value = cityName; box.style.display = 'none'; };
                            box.appendChild(div);
                        });
                        box.style.display = 'block';
                    } else box.style.display = 'none';
                } catch (err) { box.style.display = 'none'; }
            }, 400);
        }

        document.addEventListener('click', (e) => { if (!e.target.closest('.form-group')) document.getElementById('citySuggestionsBox').style.display = 'none'; });

        // ==========================================
        // MODULE: Logging & Offline Sync
        // ==========================================
        function updateNetworkStatus() {
            const statusEl = document.getElementById('networkStatus');
            if (navigator.onLine) { statusEl.classList.remove('status-offline'); syncOfflineLogs(); fetchDynamicTexts(); } 
            else { statusEl.classList.add('status-offline'); }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        async function syncOfflineLogs() {
            let offlineLogs = JSON.parse(localStorage.getItem('mysticOfflineLogs') || '[]');
            if (offlineLogs.length > 0 && navigator.onLine && typeof supabaseClient !== 'undefined') {
                try {
                    const { error } = await supabaseClient.from('reports_log').insert(offlineLogs);
                    if (!error) localStorage.removeItem('mysticOfflineLogs');
                } catch (err) {}
            }
        }

        async function writeToLog(actionType) {
            try {
                const getVal = id => document.getElementById(id).value.trim() || null;
                let logEntry = {
                    action_date: new Date().toISOString().split('T')[0],
                    action_time: new Date().toTimeString().split(' ')[0],
                    action_type: actionType,
                    first_name: getVal('firstName'),
                    last_name: getVal('lastName'),
                    phone: getVal('phone'),
                    birth_date: getVal('birthDate'),
                    city: getVal('city') || 'ירושלים'
                };
                
                // הסרת שדות ריקים למניעת זריקת שגיאת DB Schema Error 400
                Object.keys(logEntry).forEach(k => logEntry[k] === null && delete logEntry[k]);

                if (navigator.onLine && typeof supabaseClient !== 'undefined') await supabaseClient.from('reports_log').insert([logEntry]);
                else {
                    let logs = JSON.parse(localStorage.getItem('mysticOfflineLogs') || '[]');
                    logs.push(logEntry);
                    localStorage.setItem('mysticOfflineLogs', JSON.stringify(logs));
                }
            } catch (err) {}
        }

        // ==========================================
        // MODULE: UI Controllers & Logic
        // ==========================================
        async function handleUserAction(actionType) {
            writeToLog(actionType); // א-סינכרוני ברקע

            if (actionType === 'pdf_download') {
                const titleBackup = document.title;
                const fn = Security.escapeHTML(document.getElementById('firstName').value) || 'דוח';
                const ln = Security.escapeHTML(document.getElementById('lastName').value) || 'מיסטי';
                const bd = document.getElementById('birthDate').value;
                const dForm = bd ? `-${bd.split('-').reverse().join('-')}` : '';
                document.title = `${fn}-${ln}${dForm}`;
                window.print();
                document.title = titleBackup;
                return;
            }
            if (actionType === 'whatsapp_share') {
                const phone = Security.sanitizeDigits(document.getElementById('phone').value);
                if (!phone) return alert("אנא הזן טלפון.");
                window.location.href = `whatsapp://send?phone=${phone.replace(/^0/, '972')}&text=${encodeURIComponent(document.getElementById('contentToPrint').innerText)}`;
                return;
            }

            // Validation
            const fName = Security.escapeHTML(document.getElementById('firstName').value.trim());
            const lName = Security.escapeHTML(document.getElementById('lastName').value.trim());
            const phone = Security.sanitizeDigits(document.getElementById('phone').value);
            const dateVal = document.getElementById('birthDate').value;
            let city = Security.escapeHTML(document.getElementById('city').value.trim()) || "ירושלים";

            if (!fName || !lName || !phone || !dateVal) return alert("חובה למלא: שם פרטי, משפחה, טלפון ותאריך לידה.");
            
            runCalculation(fName, lName, phone, dateVal, city);
        }

        async function runCalculation(fName, lName, phone, dateVal, city) {
            const mName = Security.escapeHTML(document.getElementById('middleName').value.trim());
            const eName = Security.escapeHTML(document.getElementById('extraLastName').value.trim());
            const idNumber = Security.sanitizeDigits(document.getElementById('idNumber').value);
            const timeVal = document.getElementById('birthTime').value;

            document.getElementById('calcBtn').disabled = true;
            document.getElementById('loadingMsg').style.display = 'block';
            document.getElementById('results').style.display = 'none';

            try {
                if (!navigator.onLine) throw new Error("מצב אופליין. נא להתחבר לרשת להפקת דוח אסטרונומי מלא.");

                // 1. Geo & Sunset Logic
                let geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}&limit=1`);
                let geoData = await geoRes.json();
                if (!geoData.length) throw new Error("עיר לא נמצאה.");
                
                let sunsetRes = await fetch(`https://api.sunrise-sunset.org/json?lat=${geoData[0].lat}&lng=${geoData[0].lon}&date=${dateVal}&formatted=0`);
                let sunsetData = await sunsetRes.json();
                let birthDtObj = new Date(`${dateVal}T${timeVal}:00`);
                if (birthDtObj > new Date(sunsetData.results.sunset)) birthDtObj.setDate(birthDtObj.getDate() + 1);

                // 2. Hebcal Logic
                let hebReq = await fetch(`https://www.hebcal.com/converter?cfg=json&gy=${birthDtObj.getFullYear()}&gm=${birthDtObj.getMonth()+1}&gd=${birthDtObj.getDate()}&g2h=1`);
                let hebData = await hebReq.json();

                let today = new Date();
                let targetHy = (await (await fetch(`https://www.hebcal.com/converter?cfg=json&gy=${today.getFullYear()}&gm=${today.getMonth()+1}&gd=${today.getDate()}&g2h=1`)).json()).hy;
                
                let nextBday = await (await fetch(`https://www.hebcal.com/converter?cfg=json&hy=${targetHy}&hm=${hebData.hm}&hd=${hebData.hd}&h2g=1`)).json();
                if (new Date(nextBday.gy, nextBday.gm - 1, nextBday.gd) < today) {
                    nextBday = await (await fetch(`https://www.hebcal.com/converter?cfg=json&hy=${targetHy + 1}&hm=${hebData.hm}&hd=${hebData.hd}&h2g=1`)).json();
                }

                // 3. UI Construction
                const hebrewBdayFull = hebData.hebrew.replace(/״/g, '"').replace(/׳/g, "'");
                let hebrewYearOnly = "ה'" + nextBday.hebrew.split(' ').pop().replace(/״/g, '"').replace(/׳/g, "'");
                
                let dObj = new Date(dateVal);
                let zIndex = Calculators.getZodiacIndex(dObj.getDate(), dObj.getMonth() + 1);
                let sunSign = Dictionary.zodiac[zIndex];
                let ascendant = Calculators.getAscendant(zIndex, timeVal);

                document.getElementById('resAstro').innerHTML = `
                    <div class="result-item result-date">
                        <p style="font-size: 1.2em; color: #1b4f72;">תאריך לידה עברי: <strong style="font-size: 1.3em;">${hebrewBdayFull}</strong></p>
                        <p style="font-size: 0.9em; color: #1b4f72;">יום הולדת עברי קרוב: <strong>${nextBday.gd}/${nextBday.gm}/${nextBday.gy}</strong> (<span style="font-weight: bold; font-size: 1.5em;">${hebrewYearOnly}</span>)</p>
                    </div>
                    <div class="result-item"><h4>מזל שמש: ${sunSign.name}</h4><p class="light-text">${sunSign.desc}</p></div>
                    <div class="result-item"><h4>מזל אופק: ${ascendant}</h4><p class="light-text">${Dictionary.ascendant[ascendant]}</p></div>
                `;

                // Numerology Builder
                let namesHtml = "";
                const addItem = (label, val, prefix = "מספר נומרולוגי:") => {
                    if (!val) return;
                    let num = Calculators.numerology(Calculators.sumDigits(val) || Calculators.gematria(val));
                    namesHtml += `<div class="result-item"><h4>${label}: ${val}</h4><p><strong>${prefix} ${num}</strong></p><p class="light-text">${Dictionary.numerology[num]}</p></div>`;
                };

                addItem("שם פרטי", fName);
                addItem("שם נוסף", mName);
                addItem("שם משפחה", lName);
                addItem("משפחה נוסף", eName);
                
                let totG = Calculators.gematria(fName+mName+lName+eName);
                let totN = Calculators.numerology(totG);
                namesHtml += `<div class="result-item"><h4>כל השמות יחד (${totG})</h4><p><strong>מספר נומרולוגי: ${totN}</strong></p><p class="light-text">${Dictionary.numerology[totN]}</p></div>`;
                
                let dParts = dateVal.split('-');
                addItem("מספר מזל", `${dParts[2]}/${dParts[1]}/${dParts[0]}`);
                addItem("מספר תקשורת", phone);
                if (idNumber) addItem("מספר זהות", idNumber);

                document.getElementById('resNamesNum').innerHTML = namesHtml;
                document.getElementById('resName').innerText = `${fName} ${lName}`;
                document.getElementById('results').style.display = 'block';

            } catch (err) { alert(err.message); } 
            finally {
                document.getElementById('calcBtn').disabled = false;
                document.getElementById('loadingMsg').style.display = 'none';
            }
        }

        window.addEventListener('DOMContentLoaded', () => { updateNetworkStatus(); });
    </script>
</body>
</html>
