<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הדוח המיסטי שלי</title>
    
    <!-- טעינת ספריות קונפיגורציה -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    
    <style>
        /* [הערת מתחזק: העיצוב נותר זהה לבקשת הלקוח, מרוכז במשתני CSS] */
        :root {
            --primary-color: #3498db;
            --primary-dark: #2980b9;
            --accent-color: #f39c12;
            --accent-dark: #d68910;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #ccd1d9;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); padding: 20px; line-height: 1.6; color: var(--text-color); }
        .container { max-width: 850px; margin: auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { text-align: center; color: var(--text-color); }
        
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; margin-bottom: 0; min-width: 0; position: relative; } 
        
        @media (max-width: 600px) {
            .form-row { flex-direction: column; gap: 15px; }
        }

        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary-color); font-size: 0.95em; transform: translateX(-2ch); }
        input { width: 100%; height: 38px; padding: 6px 12px; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 6px; font-size: 15px; background: #ffffff; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.04); text-align: right; transition: all 0.3s; }
        input:focus { border-color: var(--primary-color); box-shadow: inset 0 2px 4px rgba(0,0,0,0.04), 0 0 8px rgba(52, 152, 219, 0.3); outline: none; }

        .action-buttons-top { display: flex; gap: 15px; margin-top: 25px; }
        .main-btn, .premium-btn, .whatsapp-btn, .pdf-btn { color: white; flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        .main-btn { background-color: var(--primary-color); } .main-btn:hover { background-color: var(--primary-dark); }
        .premium-btn { background-color: var(--accent-color); } .premium-btn:hover { background-color: var(--accent-dark); }
        .whatsapp-btn { background-color: #25D366; font-size: 16px; }
        .pdf-btn { background-color: #e74c3c; font-size: 16px; }
        
        #results { margin-top: 30px; display: none; }
        #contentToPrint { background-color: #ffffff; padding: 20px; border: 2px solid #ecf0f1; border-radius: 8px; }
        #contentToPrint h2 { text-decoration: underline; text-underline-offset: 8px; margin-bottom: 25px;}
        
        .result-section { margin-bottom: 15px; }
        .result-item { background: #f7fbfe; padding: 15px; margin-bottom: 12px; border-radius: 6px; border-right: 5px solid #85c1e9; }
        .result-zodiac { background: #ebf5fb; border-right-color: var(--primary-color); }
        .result-date { background: #d4e6f1; border-right-color: #1b4f72; }
        .result-item h4 { margin: 0 0 8px 0; font-size: 1.1em; }
        .result-item p { margin: 0 0 5px 0; color: #555; text-align: justify; }
        .light-text { color: #5d6d7e !important; }
        .actions { display: flex; gap: 15px; margin-top: 25px; }
        #loadingMsg { display: none; text-align: center; color: var(--primary-color); font-weight: bold; margin-top: 15px; font-size: 1.1em;}

        @media print {
            body { background-color: white; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            .form-row, h1, .action-buttons-top, .actions, #loadingMsg { display: none !important; }
            #results { display: block !important; border: none; margin: 0; padding: 0; }
            #contentToPrint { border: none; padding: 0; }
            .result-item { page-break-inside: avoid; border-right: 4px solid black; text-align: justify; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>הדוח המיסטי שלי</h1>
        
        <!-- טופס איסוף נתונים (מזהי ID חייבים להיות מסונכרנים עם קוד ה-JS) -->
        <div class="form-row">
            <div class="form-group"><label>שם פרטי (חובה):</label><input type="text" id="firstName"></div>
            <div class="form-group"><label>שם פרטי נוסף (לא חובה):</label><input type="text" id="middleName"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>שם משפחה (חובה):</label><input type="text" id="lastName"></div>
            <div class="form-group"><label>שם משפחה נוסף (לא חובה):</label><input type="text" id="extraLastName"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>מספר טלפון נייד (חובה):</label><input type="tel" id="phone"></div>
            <div class="form-group"><label>מספר תעודת זהות (לא חובה):</label><input type="text" id="idNumber"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>תאריך לידה (חובה):</label><input type="date" id="birthDate"></div>
            <div class="form-group"><label>שעת לידה (24 שעות):</label><input type="time" id="birthTime" value="12:00"></div>
            <div class="form-group"><label>עיר לידה:</label><input type="text" id="city" value="ירושלים"></div>
        </div>

        <div class="action-buttons-top">
            <button id="calcBtn" class="main-btn" onclick="handleUserAction('basic_report')">הפק דוח בסיסי</button>
            <button class="premium-btn" onclick="handleUserAction('deep_report')">הפק דוח עמוק</button>
        </div>
        
        <div id="loadingMsg">מעבד נתונים מול כוכבי השמיים... נא להמתין...</div>

        <div id="results">
            <div id="contentToPrint">
                <h2><span id="resName"></span> - דוח מיסטי</h2>
                <div class="result-section"><div id="resAstro"></div></div>
                <div class="result-section"><div id="resNamesNum"></div></div>
            </div>
            
            <div class="actions">
                <button class="whatsapp-btn" onclick="handleUserAction('whatsapp_share')">שלח דוח לוואטסאפ</button>
                <button class="pdf-btn" onclick="handleUserAction('pdf_download')">הורד דוח כ-PDF</button>
            </div>
        </div>
    </div>

    <script>
        // [הערת מתחזק: מילוני נתונים סטטיים של המספרים והמזלות. ניתן להרחיב לפי הצורך]
        const gematriaDict = { 'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10, 'כ':20,'ך':20,'ל':30,'מ':40,'ם':40,'נ':50,'ן':50,'ס':60,'ע':70, 'פ':80,'ף':80,'צ':90,'ץ':90,'ק':100,'ר':200,'ש':300,'ת':400 };
        const numerologyTexts = {
            1: "מנהיגות מולדת, עצמאות וכוח רצון עז.", 2: "זוגיות, שותפות, דיפלומטיה ורגישות.",
            3: "ביטוי עצמי, יצירתיות, שמחת חיים.", 4: "יציבות, סדר, משמעת קפדנית.",
            5: "חופש, הרפתקנות, תנועה מתמדת.", 6: "משפחתיות, הרמוניה ושירות לזולת.",
            7: "רוחניות, העמקה ואינטואיציה חדה.", 8: "עוצמה, סמכות והישגיות חומרית.",
            9: "הומניטריות, נתינה אוניברסלית וסיום מעגלים."
        };
        const zodiacSigns = [
            { name: "טלה", desc: "מזל אש דינמי ויצרי." }, { name: "שור", desc: "מזל אדמה יציב ופרקטי." },
            { name: "תאומים", desc: "מזל אוויר אינטלקטואלי ומהיר." }, { name: "סרטן", desc: "מזל מים רגשי ומשפחתי." },
            { name: "אריה", desc: "מזל אש מלכותי וזורח." }, { name: "בתולה", desc: "מזל אדמה מאורגן ואנליטי." },
            { name: "מאזניים", desc: "מזל אוויר אסתטי ודיפלומטי." }, { name: "עקרב", desc: "מזל מים אינטנסיבי ומגנטי." },
            { name: "קשת", desc: "מזל אש אופטימי ופילוסופי." }, { name: "גדי", desc: "מזל אדמה שאפתן ומעשי." },
            { name: "דלי", desc: "מזל אוויר מקורי ואינדיבידואלי." }, { name: "דגים", desc: "מזל מים רוחני וחומל." }
        ];

        // אלגוריתמים מתמטיים/גימטריים
        function calcGematria(word) {
            let sum = 0; if (!word) return 0;
            for (let i = 0; i < word.length; i++) if (gematriaDict[word[i]]) sum += gematriaDict[word[i]];
            return sum;
        }
        function calcNumerology(number) {
            if (!number) return 0;
            let sum = number;
            while (sum > 9) {
                let temp = 0, str = sum.toString();
                for (let i = 0; i < str.length; i++) temp += parseInt(str[i]);
                sum = temp;
            }
            return sum;
        }
        function calcNumFromDigits(str) {
            let onlyNum = str.replace(/\D/g, ''); // מסנן הכל מלבד ספרות
            let sum = 0;
            for (let i = 0; i < onlyNum.length; i++) sum += parseInt(onlyNum[i]);
            return sum;
        }
        async function fetchUserIP() {
            try { const res = await fetch('https://api.ipify.org?format=json'); const data = await res.json(); return data.ip; }
            catch { return "Unknown"; }
        }

        // ==========================================
        // מודול הרישום לשרת (Logging Module) - מוגן מפני שגיאות 400
        // ==========================================
        async function writeToExperimentLog(actionType) {
            try {
                const now = new Date();
                const getFieldValue = (id) => { const el = document.getElementById(id); return el && el.value.trim() !== '' ? el.value.trim() : null; };

                // יצירת אובייקט הנתונים הבסיסי שכולל שדות מערכת
                let logEntry = {
                    action_date: now.toISOString().split('T')[0],
                    action_time: now.toTimeString().split(' ')[0],
                    ip_address: await fetchUserIP(),
                    browser_info: navigator.userAgent,
                    action_type: actionType,
                    first_name: getFieldValue('firstName'),
                    middle_name: getFieldValue('middleName'),
                    last_name: getFieldValue('lastName'),
                    extra_last_name: getFieldValue('extraLastName'),
                    phone: getFieldValue('phone'),
                    id_number: getFieldValue('idNumber'),
                    birth_date: getFieldValue('birthDate'),
                    birth_time: getFieldValue('birthTime'),
                    city: getFieldValue('city')
                };

                // [הערת מתחזק: מחיקת מפתחות ריקים (null) למניעת התנגשויות (400 Bad Request) מול הסכמה של ה-DB]
                Object.keys(logEntry).forEach(key => {
                    if (logEntry[key] === null) {
                        delete logEntry[key];
                    }
                });

                if (typeof supabaseClient !== 'undefined') {
                    // ביצוע השליחה ותפיסת שגיאות מפורטות
                    const { data, error } = await supabaseClient.from('reports_log').insert([logEntry]);
                    if (error) {
                        console.error("שגיאת שרת מפורטת מ-Supabase:", error.message, error.details);
                    } else {
                        console.log("הלוג נרשם בהצלחה במסד הנתונים!");
                    }
                }
            } catch (err) {
                console.error("שגיאת קוד בזמן ניסיון הרישום:", err);
            }
        }

        // ניתוב פעולות המשתמש
        async function handleUserAction(actionType) {
            await writeToExperimentLog(actionType);

            if (actionType === 'deep_report') { alert("הפקת דוח עמוק עדיין בפיתוח."); return; }
            if (actionType === 'whatsapp_share') { window.print(); return; } // מעקף זמני לשיתוף
            if (actionType === 'pdf_download') { window.print(); return; }

            if (actionType === 'basic_report') {
                const fName = document.getElementById('firstName').value.trim();
                const lName = document.getElementById('lastName').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const bDate = document.getElementById('birthDate').value;
                if (!fName || !lName || !phone || !bDate) {
                    alert("חובה למלא את כל שדות החובה."); return;
                }
                runBasicReportCalculation();
            }
        }

        // ==========================================
        // אלגוריתם הדוח המרכזי 
        // ==========================================
        function runBasicReportCalculation() {
            document.getElementById('calcBtn').disabled = true;
            document.getElementById('loadingMsg').style.display = 'block';
            document.getElementById('results').style.display = 'none';

            try {
                // שליפת נתונים רלוונטיים
                const fName = document.getElementById('firstName').value.trim();
                const lName = document.getElementById('lastName').value.trim();
                const idNum = document.getElementById('idNumber').value.trim();
                
                let namesHtml = "";
                let totGematria = calcGematria(fName + lName);
                let totNum = calcNumerology(totGematria);

                namesHtml += `<div class="result-item"><h4>שם מלא: ${fName} ${lName} (${totGematria})</h4><p><strong>מספר נומרולוגי:</strong> ${totNum}</p><p class="light-text">${numerologyTexts[totNum]}</p></div>`;

                // [הערת מתחזק: תוספת חדשה - חישוב נומרולוגיה לתעודת זהות אם הוזנה]
                if (idNum) {
                    let idSum = calcNumFromDigits(idNum); // מחשב את סכום הספרות (מוריד תווים לא תקינים)
                    let idNumValue = calcNumerology(idSum); // מצמצם את הסכום לספרה בודדת
                    namesHtml += `<div class="result-item"><h4>תעודת זהות: ${idNum}</h4><p><strong>מספר נומרולוגי:</strong> ${idNumValue}</p><p class="light-text">${numerologyTexts[idNumValue]}</p></div>`;
                }

                // הדפסה למסך
                document.getElementById('resName').innerText = `${fName} ${lName}`;
                document.getElementById('resNamesNum').innerHTML = namesHtml;
                document.getElementById('results').style.display = 'block';

            } catch (err) {
                alert("אירעה שגיאה: " + err.message);
            } finally {
                document.getElementById('calcBtn').disabled = false;
                document.getElementById('loadingMsg').style.display = 'none';
            }
        }
    </script>
</body>
</html>
