    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; padding: 20px; line-height: 1.6;}
        .container { max-width: 850px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { text-align: center; color: #2c3e50; }
        
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-row .form-group { flex: 1; margin-bottom: 0; min-width: 0; } 
        
        @media (max-width: 600px) {
            .form-row { flex-direction: column; gap: 15px; }
        }

        .form-group label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #3498db; 
            font-size: 0.95em;
            word-wrap: break-word;
            transform: translateX(-2ch); 
        }

        input { 
            width: 100%; 
            height: 36px; 
            padding: 6px 12px; 
            box-sizing: border-box; 
            border: 1px solid #ccd1d9; 
            border-radius: 6px; 
            font-size: 15px; 
            background: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06); 
            transition: all 0.3s ease; 
            text-align: right; 
        }

            border-color: #3498db;

        #contentToPrint { background-color: #ffffff; padding: 20px; border: 2px solid #ecf0f1; border-radius: 8px; }
        
        #contentToPrint h2 { text-decoration: underline; text-underline-offset: 8px; color: #2c3e50; margin-bottom: 25px;}
        
        .result-section { margin-bottom: 15px; }

        .result-zodiac { background: #ebf5fb; border-right-color: #2980b9; }

        .result-item p { margin: 0 0 5px 0; color: #555; text-align: justify; }

        .actions { display: flex; gap: 15px; margin-top: 25px; }
        .whatsapp-btn { background-color: #25D366; color: white; flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;}

        <div class="form-row">

        </div>

        <div class="action-buttons-top">
            <button id="calcBtn" class="main-btn" onclick="handleAction('basic_report')">הפק דוח בסיסי</button>
            <button class="premium-btn" onclick="handleAction('deep_report')">הפק דוח עמוק</button>
        </div>

                </div>

                </div>
            </div>
            
            <div class="actions">

        function calcGematria(word) {
            let sum = 0;
            if (!word) return 0;
            for (let i = 0; i < word.length; i++) {
                if (gematriaDict[word[i]]) sum += gematriaDict[word[i]];
            }
            return sum;
        }

        function calcNumerology(number) {
            if (!number || number === 0) return 0;
            let sum = number;
            while (sum > 9) {
                let tempSum = 0;
                let numStr = sum.toString();
                for (let i = 0; i < numStr.length; i++) tempSum += parseInt(numStr[i]);
                sum = tempSum;
            }
            return sum;
        }

        function calcNumFromDigits(str) {
            let onlyNumbers = str.replace(/\D/g, ''); 
            let sum = 0;
            for (let i = 0; i < onlyNumbers.length; i++) sum += parseInt(onlyNumbers[i]);
            return sum;
        }

        function getZodiacIndex(day, month) {
            if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return 0;
            if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return 1;
            if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) return 2;
            if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) return 3;
            if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return 4;
            if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return 5;
            if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) return 6;
            if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) return 7;
            if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) return 8;
            if ((month == 12 && day >= 22) || (month == 1 && day <= 19)) return 9;
            if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return 10;
            if ((month == 2 && day >= 19) || (month == 3 && day <= 20)) return 11;
            return 0; 
        }

        function calculateAscendant(sunSignIndex, birthTimeStr) {
            let parts = birthTimeStr.split(":");
            let decimalTime = parseInt(parts[0]) + (parseInt(parts[1]) / 60);
            let diffHours = decimalTime - 6;
            if (diffHours < 0) diffHours += 24; 
            let signOffset = Math.floor(diffHours / 2);
            return zodiacSigns[(sunSignIndex + signOffset) % 12].name;
        }

                let fullName = `${fName} ${lName}`;
                document.getElementById('resName').innerText = fullName;
                document.getElementById('resName').setAttribute('data-fullname', fullName);
                
                document.getElementById('results').style.display = 'block';

            } catch (error) {
                alert("אירעה שגיאה: " + error.message);
            } finally {
                document.getElementById('calcBtn').disabled = false;
                document.getElementById('loadingMsg').style.display = 'none';
            }
        }

        // ביצוע שיתוף וואטסאפ
        function executeWhatsAppShare() {
            const phone = document.getElementById('phone').value.trim();
            if (!phone) {
                alert("אנא הזן מספר טלפון בטופס למעלה.");
                return;
            }
            let cleanPhone = phone.replace(/^0/, '972').replace(/\D/g, ''); 
            let titleText = document.querySelector('#contentToPrint h2').innerText;
            let textToShare = document.getElementById('contentToPrint').innerText;
            
            textToShare = textToShare.replace(titleText, titleText + "\n\n");
            
            window.location.href = `whatsapp://send?phone=${cleanPhone}&text=${encodeURIComponent(textToShare)}`;
        }

        // ביצוע הורדת PDF
        function executePDFDownload() {
            let fullName = document.getElementById('resName').getAttribute('data-fullname') || 'משתמש';
            let fileName = fullName.replace(/\s+/g, '_') + '_דוח_מיסטי';
            
            const originalTitle = document.title;
            document.title = fileName;
            
            window.print();
            
            document.title = originalTitle;
        }
    </script>
</body>
</html>
