<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הדוח המיסטי שלי</title>
    
    <!-- חיבור לקובץ ההגדרות (Manifest) -->
    <link rel="manifest" href="manifest.json">
    
    <!-- חיבור לספריית Supabase ולקובץ ההגדרות -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    
    <style>
        :root {
            --primary-color: #3498db;
            --primary-dark: #2980b9;
            --accent-color: #f39c12;
            --accent-dark: #d68910;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #ccd1d9;
            --ios-color: #007aff;
            --premium-color: #8e44ad;
            --premium-bg: #f5eef8;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); padding: 20px; line-height: 1.6; color: var(--text-color); }
        .container { max-width: 850px; margin: auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { text-align: center; color: var(--text-color); }
        
        #installBanner { display: none; background-color: var(--accent-color); color: white; text-align: center; padding: 12px; cursor: pointer; font-weight: bold; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background 0.3s; }
        #installBanner:hover { background-color: var(--accent-dark); }

        #iosInstallBanner { display: none; background-color: var(--ios-color); color: white; text-align: center; padding: 12px; font-weight: bold; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; margin-bottom: 0; min-width: 0; position: relative; } 
        
        @media (max-width: 600px) { .form-row { flex-direction: column; gap: 15px; } }

        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary-color); font-size: 0.95em; transform: translateX(-2ch); }
        input { width: 100%; height: 38px; padding: 6px 12px; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 6px; font-size: 15px; background: #ffffff; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.04); text-align: right; transition: all 0.3s; }
        input:focus { border-color: var(--primary-color); box-shadow: inset 0 2px 4px rgba(0,0,0,0.04), 0 0 8px rgba(52, 152, 219, 0.3); outline: none; }

        .suggestions-box { position: absolute; top: 100%; right: 0; left: 0; background: #ffffff; border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 6px 6px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); z-index: 1000; max-height: 150px; overflow-y: auto; display: none; }
        .suggestion-item { padding: 8px 12px; cursor: pointer; font-size: 14px; text-align: right; border-bottom: 1px solid #f0f0f0; }
        .suggestion-item:hover { background-color: #ebf5fb; color: var(--primary-dark); }
        
        .action-buttons-top { display: flex; gap: 15px; margin-top: 25px; }
        .main-btn, .premium-btn { color: white; flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; transition: background 0.3s;}
        .main-btn { background-color: var(--primary-color); }
        .main-btn:hover { background-color: var(--primary-dark); }
        .main-btn:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .premium-btn { background-color: var(--accent-color); }
        .premium-btn:hover { background-color: var(--accent-dark); }
        .premium-btn:disabled { background-color: #f5cba7; cursor: not-allowed; }
        
        #results { margin-top: 30px; display: none; }
        #contentToPrint { background-color: #ffffff; padding: 20px; border: 2px solid #ecf0f1; border-radius: 8px; }
        #contentToPrint h2 { text-decoration: underline; text-underline-offset: 8px; margin-bottom: 25px;}
        
        .result-section { margin-bottom: 15px; }
        .result-item { background: #f7fbfe; padding: 15px; margin-bottom: 12px; border-radius: 6px; border-right: 5px solid #85c1e9; }
        .result-zodiac { background: #ebf5fb; border-right-color: var(--primary-color); }
        .result-date { background: #d4e6f1; border-right-color: #1b4f72; }
        
        .result-item h4 { margin: 0 0 8px 0; font-size: 1.1em; color: var(--text-color); }
        .result-item p { margin: 0 0 5px 0; color: #333; text-align: justify; }
        .light-text { color: #555 !important; }

        .actions { display: flex; gap: 15px; margin-top: 25px; }
        .whatsapp-btn, .pdf-btn { color: white; flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;}
        .whatsapp-btn { background-color: #25D366; }
        .pdf-btn { background-color: #e74c3c; }
        
        #loadingMsg { display: none; text-align: center; color: var(--primary-color); font-weight: bold; margin-top: 15px; font-size: 1.1em;}

        #networkStatus { text-align: center; font-size: 0.9em; padding: 5px; margin-bottom: 15px; border-radius: 4px; display: none; }
        .status-offline { background-color: #f8d7da; color: #721c24; display: block !important; }

        @media print {
            body { background-color: white; padding: 0; color: #000; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .form-row, h1, .action-buttons-top, .actions, #loadingMsg, #networkStatus, #installBanner, #iosInstallBanner { display: none !important; }
            #results { display: block !important; border: none; margin: 0; padding: 0; }
            #contentToPrint { border: none; padding: 0; background: white; }
            .result-item { page-break-inside: avoid; border-right: 4px solid #2c3e50 !important; background: #fdfdfd !important; padding: 12px; margin-bottom: 10px; box-shadow: none; text-align: justify; }
            h3, h4 { color: #000 !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="networkStatus">מצב אופליין: אין חיבור לאינטרנט. הפעולות נשמרות מקומית.</div>
        
        <div id="installBanner" onclick="installApp()">📲 התקן את האפליקציה על המכשיר שלך לחוויה מהירה ומושלמת</div>
        <div id="iosInstallBanner">🍏 להתקנת האפליקציה באייפון: לחץ על כפתור השיתוף (למטה) ובחר "הוסף למסך הבית"</div>
        
        <h1>הדוח המיסטי שלי</h1>
        
        <div class="form-row">
            <div class="form-group"><label>שם פרטי (חובה):</label><input type="text" id="firstName" autocomplete="given-name"></div>
            <div class="form-group"><label>שם פרטי נוסף (לא חובה):</label><input type="text" id="middleName" autocomplete="additional-name"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>שם משפחה (חובה):</label><input type="text" id="lastName" autocomplete="family-name"></div>
            <div class="form-group"><label>שם משפחה נוסף (לא חובה):</label><input type="text" id="extraLastName" autocomplete="off"></div>
        </div>

        <div class="form-row">
            <div class="form-group"><label>מספר טלפון נייד (חובה):</label><input type="tel" id="phone" autocomplete="tel"></div>
            <div class="form-group"><label>מספר תעודת זהות (לא חובה):</label><input type="text" id="idNumber" autocomplete="off"></div>
        </div>

        <div class="form-row">
            <div class="form-group"><label>תאריך לידה (חובה):</label><input type="date" id="birthDate" autocomplete="bday"></div>
            <div class="form-group"><label>שעת לידה (24 שעות):</label><input type="time" id="birthTime" value="15:00"></div>
            <div class="form-group">
                <label>עיר לידה (לא חובה):</label><input type="text" id="city" value="יפו" autocomplete="off" oninput="fetchCitySuggestions(this.value)">
                <div id="citySuggestionsBox" class="suggestions-box"></div>
            </div>
        </div>

        <div class="action-buttons-top">
            <button id="calcBtn" class="main-btn" onclick="handleUserAction('basic')">הפק דוח בסיסי</button>
            <button class="premium-btn" onclick="handleUserAction('deep')">הפק דוח עמוק</button>
        </div>
        
        <div id="loadingMsg">מעבד נתונים מול כוכבי השמיים ומאגרי התאריכים... נא להמתין...</div>

        <div id="results">
            <div id="contentToPrint">
                <h2><span id="resName"></span> - דוח מיסטי</h2>
                <div class="result-section" id="resAstro"></div>
                <div class="result-section" id="resNamesNum"></div>
            </div>
            
            <div class="actions">
                <button class="whatsapp-btn" onclick="executeWhatsAppShare()">שלח דוח לוואטסאפ</button>
                <button class="pdf-btn" onclick="executePDFDownload()">הורד דוח כ-PDF</button>
            </div>
        </div>
    </div>

    <script>
        const DOM = {
            fName: document.getElementById('firstName'),
            mName: document.getElementById('middleName'),
            lName: document.getElementById('lastName'),
            eName: document.getElementById('extraLastName'),
            phone: document.getElementById('phone'),
            idNumber: document.getElementById('idNumber'),
            dateVal: document.getElementById('birthDate'),
            timeVal: document.getElementById('birthTime'),
            city: document.getElementById('city'),
            calcBtn: document.getElementById('calcBtn'),
            premiumBtn: document.querySelector('.premium-btn'),
            loadingMsg: document.getElementById('loadingMsg'),
            resultsDiv: document.getElementById('results'),
            resAstro: document.getElementById('resAstro'),
            resNamesNum: document.getElementById('resNamesNum'),
            resNameTitle: document.getElementById('resName'),
            networkStatus: document.getElementById('networkStatus'),
            citySuggestionsBox: document.getElementById('citySuggestionsBox')
        };

        const gematriaDict = {
            'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10,
            'כ':20,'ך':20,'ל':30,'מ':40,'ם':40,'נ':50,'ן':50,'ס':60,'ע':70,
            'פ':80,'ף':80,'צ':90,'ץ':90,'ק':100,'ר':200,'ש':300,'ת':400
        };

        let numerologyTexts = {
            1: "מנהיגות מולדת, עצמאות וכוח רצון עז. אנשי ה-1 הם חלוצים, יזמים ובעלי ביטחון עצמי גבוה.",
            2: "זוגיות, שותפות, דיפלומטיה ורגישות רגשית גבוהה. מגשרים טבעיים השואפים להרמוניה.",
            3: "ביטוי עצמי, יצירתיות, שמחת חיים וכריזמה מתפרצת. תקשורתיים ואופטימיים.",
            4: "יציבות, סדר, משמעת קפדנית ועבודה קשה. הבסיס האיתן שאפשר לסמוך עליו.",
            5: "חופש, הרפתקנות, תנועה מתמדת ושינויים. זקוקים למרחב נשימה ענק וגיוון.",
            6: "האהבה, המשפחתיות, ההרמוניה והשירות המסור לזולת. המטפלים והמגוננים.",
            7: "רוחניות, העמקה, חשיבה חקרנית ואינטואיציה חדה כתער. הוגי דעות וחוקרים.",
            8: "עוצמה, סמכות, שפע חומרי, סטאטוס והישגיות בקנה מידה גדול.",
            9: "הומניטריות, נתינה אוניברסלית ללא תנאי, אצילות נפש וסיום מעגלים."
        };

        let zodiacSigns = [
            { name: "טלה", desc: "מזל אש דינמי ויצרי. פורץ דרך, אמיץ ומוביל." },
            { name: "שור", desc: "מזל אדמה יציב ופרקטי. נאמן, חושני ואמין כסלע." },
            { name: "תאומים", desc: "מזל אוויר אינטלקטואלי ומהיר תפיסה. סקרן ותקשורתי." },
            { name: "סרטן", desc: "מזל מים רגשי, משפחתי ועמוק בעל אינטואיציה חזקה." },
            { name: "אריה", desc: "מזל אש מלכותי וזורח. כריזמטי, נדיב ובעל לב ענק." },
            { name: "בתולה", desc: "מזל אדמה מאורגן, אנליטי ויורד לפרטים הקטנים." },
            { name: "מאזניים", desc: "מזל אוויר אסתטי, דיפלומטי ושואף להרמוניה וצדק." },
            { name: "עקרב", desc: "מזל מים אינטנסיבי, מגנטי ובעל עוצמה נפשית אדירה." },
            { name: "קשת", desc: "מזל אש אופטימי, פילוסופי וחובב חופש והרפתקאות." },
            { name: "גדי", desc: "מזל אדמה שאפתן, מעשי, בוגר ואחראי לטווח רחוק." },
            { name: "דלי", desc: "מזל אוויר מקורי, אינדיבידואליסט והומניטרי." },
            { name: "דגים", desc: "מזל מים רוחני, חומל, אמנותי ובעל דמיון עשיר." }
        ];

        let ascendantTexts = {
            "טלה": "חזות נמרצת, ישירה ומהירה. כישרון ליזמות ופיקוד.",
            "שור": "נוכחות רגועה, שורשית ויציבה. כישרון לפיננסים ועיצוב.",
            "תאומים": "אנרגיה קלילה, תקשורתית וסקרנית. כישרון לתקשורת ותכנות.",
            "סרטן": "הילה רכה, מכילה ואמפתית. כישרון לטיפול ופסיכולוגיה.",
            "אריה": "נוכחות כריזמטית ומרשימה. כישרון לניהול ובמה.",
            "בתולה": "חזות רצינית, מסודרת ואנליטית. כישרון למדעים וארגון.",
            "מאזניים": "קסם אישי, נעימות ודיפלומטיה. כישרון לגישור ומשפטים.",
            "עקרב": "מבט חודר, עומק ומסתוריות. כישרון לחקירות וניתוח.",
            "קשת": "אופטימיות, פתיחות ושמחת חיים. כישרון להוראה ותיירות.",
            "גדי": "רושם סמכותי, בוגר ואחראי. כישרון לניהול מערכות גדולות.",
            "דלי": "מקוריות, חדשנות ועצמאות מחשבתית. כישרון להייטק.",
            "דגים": "עדינות, רגישות ורוחניות. כישרון לאמנות וטיפול."
        };

        let chineseZodiacTexts = {
            "קוף": "אינטליגנציה, סקרנות ושובבות.",
            "תרנגול": "ביטחון עצמי, חריצות וסדר.",
            "כלב": "נאמנות, צדק והגנה.",
            "חזיר": "טוב לב, כנות ושפע.",
            "חולדה": "פיקחות, כושר הסתגלות וקסם אישי.",
            "שור": "כוח, התמדה ואמינות.",
            "נמר": "אומץ, תחרותיות ומנהיגות.",
            "ארנב": "עדינות, אלגנטיות ורגישות.",
            "דרקון": "כריזמה, כוח ומזל.",
            "נחש": "חוכמה, אינטואיציה ומסתוריות.",
            "סוס": "מרץ, עצמאות ואהבת חופש.",
            "עז": "יצירתיות, רוגע ואמפתיה."
        };

        async function fetchDynamicTexts() {
            if (!navigator.onLine || typeof supabaseClient === 'undefined') return;
            try {
                const { data, error } = await supabaseClient.from('unified_report_texts')
                                            .select('*')
                                            .eq('report_type', 'basic');
                if (error) return;
                
                if (data && data.length > 0) {
                    data.forEach(item => {
                        const category = item.category; 
                        const key = item.section_key; 
                        const content = item.content; 

                        if (category === 'numerology' || category === 'נומרולוגיה') numerologyTexts[key] = content;
                        else if (category === 'zodiac' || category === 'מזלות') {
                            let zIndex = zodiacSigns.findIndex(z => z.name === key);
                            if (zIndex !== -1) zodiacSigns[zIndex].desc = content;
                        } 
                        else if (category === 'ascendant' || category === 'אופק') ascendantTexts[key] = content;
                        else if (category === 'chinese_zodiac' || category === 'מזל_סיני') chineseZodiacTexts[key] = content;
                    });
                }
            } catch (err) {}
        }

        function updateNetworkStatus() {
            if (navigator.onLine) {
                DOM.networkStatus.classList.remove('status-offline');
                syncOfflineLogs(); 
                fetchDynamicTexts(); 
            } else {
                DOM.networkStatus.classList.add('status-offline');
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        async function syncOfflineLogs() {
            let offlineLogs = JSON.parse(localStorage.getItem('mysticOfflineLogs') || '[]');
            if (offlineLogs.length > 0 && navigator.onLine && typeof supabaseClient !== 'undefined') {
                try {
                    const { error } = await supabaseClient.from('reports_log').insert(offlineLogs);
                    if (!error) localStorage.removeItem('mysticOfflineLogs');
                } catch (err) {}
            }
        }

async function writeToExperimentLog(actionType) {
            try {
                const now = new Date();
                let cityValue = DOM.city.value.trim() || "יפו";

                // שליפת IP בצורה מסודרת ובטוחה יותר למניעת שגיאות אובייקט
                let ipAddress = "Offline";
                if (navigator.onLine) {
                    try {
                        const ipRes = await fetch('https://api.ipify.org?format=json');
                        const ipData = await ipRes.json();
                        ipAddress = ipData.ip || "Unknown";
                    } catch (e) {
                        ipAddress = "Unknown";
                    }
                }

                let logEntry = {
                    action_date: now.toISOString().split('T')[0],
                    action_time: now.toTimeString().split(' ')[0],
                    ip_address: ipAddress,
                    browser_info: navigator.userAgent,
                    action_type: actionType,
                    first_name: DOM.fName.value.trim() || null,
                    middle_name: DOM.mName.value.trim() || null,
                    last_name: DOM.lName.value.trim() || null,
                    extra_last_name: DOM.eName.value.trim() || null,
                    phone: DOM.phone.value.trim() || null,
                    id_number: DOM.idNumber.value.trim() || null,
                    birth_date: DOM.dateVal.value || null,
                    birth_time: DOM.timeVal.value || null,
                    city: cityValue
                };

                // הסרת שדות ריקים כדי לא ליצור התנגשויות מול מסד הנתונים
                Object.keys(logEntry).forEach(key => { if (logEntry[key] === null) delete logEntry[key]; });

                if (navigator.onLine && typeof supabaseClient !== 'undefined') {
                    // הוספנו לכידה והדפסה ברורה של השגיאה מהשרת
                    const { data, error } = await supabaseClient.from('reports_log').insert([logEntry]);
                    if (error) {
                        console.error("❌ שגיאה מ-Supabase בעת שמירת הלוג:", error);
                    }
                } else {
                    let offlineLogs = JSON.parse(localStorage.getItem('mysticOfflineLogs') || '[]');
                    offlineLogs.push(logEntry);
                    localStorage.setItem('mysticOfflineLogs', JSON.stringify(offlineLogs));
                }
            } catch (err) {
                console.error("❌ שגיאה כללית בפונקציית הלוגים:", err);
            }
        }

        let cityTimeout = null;
        async function fetchCitySuggestions(query) {
            if (!query || query.length < 2) { DOM.citySuggestionsBox.style.display = 'none'; return; }
            if (!navigator.onLine) return; 
            
            clearTimeout(cityTimeout);
            cityTimeout = setTimeout(async () => {
                try {
                    let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`);
                    let data = await res.json();
                    DOM.citySuggestionsBox.innerHTML = '';
                    if (data && data.length > 0) {
                        data.forEach(item => {
                            let cityName = item.display_name.split(',')[0];
                            let div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.innerText = cityName;
                            div.onclick = () => { DOM.city.value = cityName; DOM.citySuggestionsBox.style.display = 'none'; };
                            DOM.citySuggestionsBox.appendChild(div);
                        });
                        DOM.citySuggestionsBox.style.display = 'block';
                    } else { DOM.citySuggestionsBox.style.display = 'none'; }
                } catch (err) { DOM.citySuggestionsBox.style.display = 'none'; }
            }, 300);
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#city') && !e.target.closest('#citySuggestionsBox')) {
                DOM.citySuggestionsBox.style.display = 'none';
            }
        });

        function calcGematria(word) {
            let sum = 0; if (!word) return 0;
            for (let i = 0; i < word.length; i++) { if (gematriaDict[word[i]]) sum += gematriaDict[word[i]]; }
            return sum;
        }

        function calcNumerology(number) {
            if (!number) return 0;
            let sum = number;
            while (sum > 9) {
                let temp = 0, str = sum.toString();
                for (let i = 0; i < str.length; i++) temp += parseInt(str[i]);
                sum = temp;
            }
            return sum;
        }

        function calcNumFromDigits(str) {
            let onlyNum = str.replace(/\D/g, '');
            let sum = 0;
            for (let i = 0; i < onlyNum.length; i++) sum += parseInt(onlyNum[i]);
            return sum;
        }

        function getZodiacIndex(day, month) {
            if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return 0;
            if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return 1;
            if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) return 2;
            if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) return 3;
            if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return 4;
            if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return 5;
            if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) return 6;
            if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) return 7;
            if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) return 8;
            if ((month == 12 && day >= 22) || (month == 1 && day <= 19)) return 9;
            if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return 10;
            return 11;
        }

        function calculateAscendant(sunSignIndex, birthTimeStr) {
            let parts = birthTimeStr.split(":");
            let decimalTime = parseInt(parts[0]) + (parseInt(parts[1]) / 60);
            let diff = decimalTime - 6;
            if (diff < 0) diff += 24;
            let offset = Math.floor(diff / 2);
            return zodiacSigns[(sunSignIndex + offset) % 12].name;
        }

        function getChineseZodiac(year) {
            const animals = ["קוף", "תרנגול", "כלב", "חזיר", "חולדה", "שור", "נמר", "ארנב", "דרקון", "נחש", "סוס", "עז"];
            return animals[year % 12];
        }

        function toggleUIState(isLoading) {
            DOM.calcBtn.disabled = isLoading;
            DOM.premiumBtn.disabled = isLoading;
            DOM.loadingMsg.style.display = isLoading ? 'block' : 'none';
            if(isLoading) DOM.resultsDiv.style.display = 'none';
        }

        async function handleUserAction(reportType) {
            await writeToExperimentLog(reportType + '_report');

            const fName = DOM.fName.value.trim();
            const lName = DOM.lName.value.trim();
            const phone = DOM.phone.value.trim();
            const dateVal = DOM.dateVal.value;

            if (!fName || !lName || !phone || !dateVal) { alert("חובה למלא: שם פרטי, שם משפחה, מספר טלפון ותאריך לידה."); return; }
            
            const hebrewRegex = /^[\u0590-\u05FF\s'-]+$/;
            if ((fName && !hebrewRegex.test(fName)) || (DOM.mName.value.trim() && !hebrewRegex.test(DOM.mName.value.trim())) || 
                (lName && !hebrewRegex.test(lName)) || (DOM.eName.value.trim() && !hebrewRegex.test(DOM.eName.value.trim()))) {
                alert("שדות השם חייבים להכיל אותיות בעברית בלבד."); return;
            }
            if (!/^\d+$/.test(phone)) { alert("מספר טלפון חייב להכיל ספרות בלבד."); return; }
            if (DOM.idNumber.value.trim() && !/^\d+$/.test(DOM.idNumber.value.trim())) { alert("מספר תעודת זהות חייב להכיל ספרות בלבד."); return; }

            generateReport(reportType === 'deep');
        }

        async function generateReport(isDeep) {
            toggleUIState(true);
            try {
                const dateVal = DOM.dateVal.value;
                const timeVal = DOM.timeVal.value || "15:00";
                let city = DOM.city.value.trim() || "יפו";
                
                if (!navigator.onLine) throw new Error("אין חיבור אינטרנט פעיל. לא ניתן להמיר תאריכים עבריים.");

                let deepDict = {};
                if (isDeep) {
                    const { data, error } = await supabaseClient.from('unified_report_texts')
                                                .select('section_key, content')
                                                .eq('report_type', 'deep');
                    if (error) throw error;
                    if (data) data.forEach(item => deepDict[item.section_key] = item.content);
                }

                let geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}&limit=1`);
                let geoData = await geoRes.json();
                if (geoData.length === 0) throw new Error("העיר לא נמצאה.");
                let matchedGeo = geoData[0];
                let sunsetRes = await fetch(`https://api.sunrise-sunset.org/json?lat=${matchedGeo.lat}&lng=${matchedGeo.lon}&date=${dateVal}&formatted=0`);
                let sunsetData = await sunsetRes.json();
                
                let isAfterSunset = new Date(`${dateVal}T${timeVal}:00`) > new Date(sunsetData.results.sunset);
                let birthDt = new Date(`${dateVal}T${timeVal}:00`);
                if (isAfterSunset) birthDt.setDate(birthDt.getDate() + 1);

                let hebRes = await fetch(`https://www.hebcal.com/converter?cfg=json&gy=${birthDt.getFullYear()}&gm=${birthDt.getMonth()+1}&gd=${birthDt.getDate()}&g2h=1`);
                let hebData = await hebRes.json();

                let today = new Date();
                let todayHebRes = await fetch(`https://www.hebcal.com/converter?cfg=json&gy=${today.getFullYear()}&gm=${today.getMonth()+1}&gd=${today.getDate()}&g2h=1`);
                let todayHebData = await todayHebRes.json();

                let targetHy = todayHebData.hy;
                let bdayCheckRes = await fetch(`https://www.hebcal.com/converter?cfg=json&hy=${targetHy}&hm=${hebData.hm}&hd=${hebData.hd}&h2g=1`);
                let bdayCheckData = await bdayCheckRes.json();
                let bdayGregorian = new Date(bdayCheckData.gy, bdayCheckData.gm - 1, bdayCheckData.gd);

                if (bdayGregorian < today) {
                    targetHy++;
                    bdayCheckData = await (await fetch(`https://www.hebcal.com/converter?cfg=json&hy=${targetHy}&hm=${hebData.hm}&hd=${hebData.hd}&h2g=1`)).json();
                }

                let hebrewYearOnly = bdayCheckData.hebrew ? "ה'" + bdayCheckData.hebrew.split(' ').pop().replace(/״/g, '"').replace(/׳/g, "'") : bdayCheckData.hy;
                let nextBdayFormatted = `${bdayCheckData.gd}/${bdayCheckData.gm}/${bdayCheckData.gy}`;
                let hebrewBdayFull = hebData.hebrew ? hebData.hebrew.replace(/״/g, '"').replace(/׳/g, "'") : hebData.hebrew;

                let dateObj = new Date(dateVal);
                let zIndex = getZodiacIndex(dateObj.getDate(), dateObj.getMonth() + 1);
                let sunSign = zodiacSigns[zIndex];
                let ascendant = calculateAscendant(zIndex, timeVal);
                let chineseAnimal = getChineseZodiac(dateObj.getFullYear());

                const daysHebrewArr = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
                let gregDayName = daysHebrewArr[dateObj.getDay()];
                let hebDayName = daysHebrewArr[birthDt.getDay()]; 

                let h = parseInt(timeVal.split(':')[0]);
                let timeDesc = (h >= 0 && h < 5) ? "לפנות בוקר" : (h >= 5 && h < 12) ? "בבוקר" : (h >= 12 && h < 17) ? "בצהריים" : (h >= 17 && h < 20) ? "בערב" : "בלילה";
                
                let exactDayString = isAfterSunset ? `<strong>אור ליום ${hebDayName} בשבוע</strong>` : `<strong>ביום ${hebDayName} בשבוע</strong>`;
                let gregNote = (gregDayName !== hebDayName) ? ` (לפי השעון הלועזי: יום ${gregDayName})` : ``;

                let sunDesc = isDeep ? (deepDict[sunSign.name] || sunSign.desc) : sunSign.desc;
                let ascDesc = isDeep ? (deepDict[ascendant] || ascendantTexts[ascendant]) : ascendantTexts[ascendant];
                let chineseDesc = isDeep ? (deepDict[chineseAnimal] || chineseZodiacTexts[chineseAnimal]) : chineseZodiacTexts[chineseAnimal];

                let premiumStyle = isDeep ? 'style="border-right-color: var(--premium-color); background-color: var(--premium-bg);"' : '';
                DOM.resAstro.innerHTML = `
                    <div class="result-item result-date" ${premiumStyle}>
                        ${isDeep ? '<h3 style="color: var(--premium-color); margin-top: 0; margin-bottom: 15px;">דוח מיסטי עמוק (פרימיום)</h3>' : ''}
                        <p style="font-size: 1.3em; color: #1b4f72; margin: 8px 0;">תאריך הלידה העברי שלך הוא: <strong style="font-size: 1.4em;">${hebrewBdayFull}</strong></p>
                        <p style="font-size: 1.1em; color: #1b4f72; margin: 8px 0;">הלידה התרחשה ב${city} ${exactDayString} בשעה ${timeVal} ${timeDesc}${gregNote}.</p>
                        <p style="font-size: 1.1em; color: #1b4f72; margin: 8px 0;">יום ההולדת העברי הקרוב <strong style="font-size: 1.4em;">[${hebrewYearOnly}]</strong> יחול בתאריך: <strong style="font-size: 1.7em;">${nextBdayFormatted}</strong></p>
                    </div>
                    <div class="result-item result-zodiac" ${isDeep ? 'style="border-right-color: var(--premium-color);"' : ''}>
                        <h4 ${isDeep ? 'style="color: var(--premium-color);"' : ''}>מזל שמש: ${sunSign.name}</h4><p class="light-text">${sunDesc}</p>
                    </div>
                    <div class="result-item result-zodiac" ${isDeep ? 'style="border-right-color: var(--premium-color);"' : ''}>
                        <h4 ${isDeep ? 'style="color: var(--premium-color);"' : ''}>מזל אופק: ${ascendant}</h4><p class="light-text">${ascDesc}</p>
                    </div>
                    <div class="result-item result-zodiac" ${isDeep ? 'style="border-right-color: var(--premium-color);"' : ''}>
                        <h4 ${isDeep ? 'style="color: var(--premium-color);"' : ''}>מזל סיני: ${chineseAnimal}</h4><p class="light-text">${chineseDesc}</p>
                    </div>
                `;

                let namesHtml = "";
                const namesList = [
                    { label: "שם פרטי", val: DOM.fName.value.trim() }, { label: "שם פרטי נוסף", val: DOM.mName.value.trim() },
                    { label: "שם משפחה", val: DOM.lName.value.trim() }, { label: "שם משפחה נוסף", val: DOM.eName.value.trim() }
                ];
                let combinedNames = "";

                namesList.forEach(item => {
                    if (item.val) {
                        combinedNames += item.val;
                        let g = calcGematria(item.val); let n = calcNumerology(g);
                        let desc = isDeep ? (deepDict[n.toString()] || numerologyTexts[n]) : numerologyTexts[n];
                        namesHtml += `<div class="result-item" ${isDeep ? 'style="border-right-color: var(--premium-color);"' : ''}><h4 ${isDeep ? 'style="color: var(--premium-color);"' : ''}>${item.label}: ${item.val} (${g})</h4><p><strong>מספר נומרולוגי: ${n}</strong></p><p class="light-text">${desc}</p></div>`;
                    }
                });

                let totG = calcGematria(combinedNames); let totN = calcNumerology(totG);
                let totDesc = isDeep ? (deepDict[totN.toString()] || numerologyTexts[totN]) : numerologyTexts[totN];
                namesHtml += `<div class="result-item" ${isDeep ? 'style="border-right-color: var(--premium-color);"' : ''}><h4 ${isDeep ? 'style="color: var(--premium-color);"' : ''}>כל השמות יחד (${totG})</h4><p><strong>מספר נומרולוגי: ${totN}</strong></p><p class="light-text">${totDesc}</p></div>`;

                let dateNum = calcNumerology(calcNumFromDigits(dateVal));
                let dDesc = isDeep ? (deepDict[dateNum.toString()] || numerologyTexts[dateNum]) : numerologyTexts[dateNum];
                namesHtml += `<div class="result-item" ${isDeep ? 'style="border-right-color: var(--premium-color);"' : ''}><h4 ${isDeep ? 'style="color: var(--premium-color);"' : ''}>מספר מזל: ${dateVal.split('-').reverse().join('/')}</h4><p><strong>מספר נומרולוגי: ${dateNum}</strong></p><p class="light-text">${dDesc}</p></div>`;

                const phone = DOM.phone.value.trim();
                const idNumber = DOM.idNumber.value.trim();
                
                if (phone) {
                    let pN = calcNumerology(calcNumFromDigits(phone));
                    let pDesc = isDeep ? (deepDict[pN.toString()] || numerologyTexts[pN]) : numerologyTexts[pN];
                    namesHtml += `<div class="result-item" ${isDeep ? 'style="border-right-color: var(--premium-color);"' : ''}><h4 ${isDeep ? 'style="color: var(--premium-color);"' : ''}>מספר תקשורת: ${phone}</h4><p><strong>מספר נומרולוגי: ${pN}</strong></p><p class="light-text">${pDesc}</p></div>`;
                }
                if (idNumber) {
                    let idN = calcNumerology(calcNumFromDigits(idNumber));
                    let idDesc = isDeep ? (deepDict[idN.toString()] || numerologyTexts[idN]) : numerologyTexts[idN];
                    namesHtml += `<div class="result-item" ${isDeep ? 'style="border-right-color: var(--premium-color);"' : ''}><h4 ${isDeep ? 'style="color: var(--premium-color);"' : ''}>מספר זהות: ${idNumber}</h4><p><strong>מספר נומרולוגי: ${idN}</strong></p><p class="light-text">${idDesc}</p></div>`;
                }

                if (isDeep) {
                    namesHtml += `<div class="result-section" style="margin-top: 35px;"><h3 style="color: var(--premium-color); border-bottom: 2px solid var(--premium-color); padding-bottom: 5px; text-align: right;">סוד האותיות: חוכמת ספר היצירה בשמך</h3><p style="margin-bottom: 15px; color: #555; text-align: right;">ניתוח מהותן של האותיות המרכיבות את שמותיך, החושפות את כוחות הנפש הפנימיים שלך.</p>`;
                    
                    let cleanNames = combinedNames.replace(/[^א-ת]/g, ''); 
                    let uniqueLetters = [...new Set(cleanNames.split(''))];
                    const finalLetters = {'ך':'כ', 'ם':'מ', 'ן':'נ', 'ף':'פ', 'ץ':'צ'};

                    uniqueLetters.forEach(char => {
                        let regularChar = finalLetters[char] || char;
                        let cosmicRaw = deepDict['cosmic_' + regularChar] || '';
                        let letterDesc = deepDict[regularChar] || "אות זו נושאת תדר אנרגטי פנימי הייחודי לשורש נשמתך.";
                        let cosmicTitle = '', cosmicContent = '';
                        
                        if (cosmicRaw) {
                            const regex = /<strong>(.*?)<\/strong><br>/;
                            const match = cosmicRaw.match(regex);
                            if (match && match[1]) {
                                cosmicTitle = match[1].replace(':', '').trim();
                                cosmicContent = cosmicRaw.replace(match[0], '').trim();
                            } else { cosmicContent = cosmicRaw; }
                        }

                        namesHtml += `<div class="result-item" style="border-right-color: var(--premium-color); background-color: #faf5fc; margin-bottom: 15px; padding: 15px;">
                            <h4 style="color: var(--premium-color); margin-bottom: 10px; font-size: 1.2em;">האות ${char}' ${cosmicTitle ? ' • שיוך קוסמי: ' + cosmicTitle : ''}</h4>
                            <p class="light-text" style="margin: 0 0 10px 0; line-height: 1.6; text-align: justify;">${letterDesc}</p>
                            ${cosmicContent ? `<div style="background-color: #ffffff; padding: 10px 15px; border-radius: 6px; border-right: 3px solid #d2b4de; margin-top: 10px;"><p class="light-text" style="margin: 0; line-height: 1.6; text-align: justify;"><strong>ההשפעה הקוסמית:</strong> ${cosmicContent}</p></div>` : ''}
                        </div>`;
                    });
                    namesHtml += `</div>`;
                }

                DOM.resNamesNum.innerHTML = namesHtml;
                DOM.resNameTitle.innerText = `${DOM.fName.value.trim()} ${DOM.lName.value.trim()}`;
                DOM.resultsDiv.style.display = 'block';

            } catch (err) { alert("אירעה שגיאה בחישוב הנתונים: " + err.message); } 
            finally { toggleUIState(false); }
        }

        function executePDFDownload() {
            let pFirstName = DOM.fName.value.trim() || 'דוח';
            let pLastName = DOM.lName.value.trim() || 'מיסטי';
            let pBirthDate = DOM.dateVal.value;
            let formattedDate = pBirthDate ? `-${pBirthDate.split('-').reverse().join('')}` : '';
            
            const originalTitle = document.title;
            document.title = `${pFirstName}-${pLastName}${formattedDate}`;
            window.print();
            setTimeout(() => document.title = originalTitle, 1000);
        }

        async function executeWhatsAppShare() {
            const phone = DOM.phone.value.trim();
            if (!phone) return alert("אנא הזן מספר טלפון לשיתוף.");
            
            const reportText = document.getElementById('contentToPrint').innerText;
            
            // ---> הוסף את השורה הזו כדי לקבל נתון אמין! <---
            console.log("📏 אורך הדוח שהופק כעת הוא בדיוק:", reportText.length, "תווים.");
            
            const cleanPhone = phone.replace(/^0/, '972').replace(/\D/g, '');

            if (reportText.length > 5400) {
                try {
                    await navigator.clipboard.writeText(reportText);
                    alert("הדוח העמוק מלא בתוכן עשיר ולכן הועתק אוטומטית ללוח שלך!\n\nמיד תועבר לוואטסאפ - פשוט לחץ 'הדבק' (Paste) בשורת ההודעה כדי לשלוח אותו ללקוח.");
                    window.location.href = `whatsapp://send?phone=${cleanPhone}`;
                } catch (err) {
                    alert("הדוח ארוך מאוד ולא הצלחנו להעתיק אותו אוטומטית. אנא השתמש בכפתור הורדת ה-PDF ושלח את הקובץ ללקוח.");
                }
            } else {
                window.location.href = `whatsapp://send?phone=${cleanPhone}&text=${encodeURIComponent(reportText)}`;
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err)));
        }

        let deferredPrompt;
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        const isInstalledLocally = localStorage.getItem('mysticAppInstalled') === 'true';

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            if (!isStandalone && !isInstalledLocally) document.getElementById('installBanner').style.display = 'block';
        });

        async function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') localStorage.setItem('mysticAppInstalled', 'true');
                deferredPrompt = null; 
                document.getElementById('installBanner').style.display = 'none';
            }
        }

        window.addEventListener('appinstalled', () => {
            localStorage.setItem('mysticAppInstalled', 'true');
            document.getElementById('installBanner').style.display = 'none';
        });

        const isIos = () => /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
        if (isIos() && !isStandalone && !isInstalledLocally) document.getElementById('iosInstallBanner').style.display = 'block';

        window.addEventListener('DOMContentLoaded', () => { updateNetworkStatus(); fetchDynamicTexts(); syncOfflineLogs(); });
    </script>
</body>
