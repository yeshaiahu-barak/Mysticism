<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ממיר CSV ל-SQL - הדוח המיסטי</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f0f4f8; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: auto; text-align: center; }
        input[type="file"] { margin: 20px 0; font-size: 16px; }
        button { background: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        .note { color: #7f8c8d; font-size: 0.9em; margin-top: 15px; }
    </style>
    <!-- שימוש בספריית PapaParse לקריאה בטוחה של קובץ CSV הכולל מעברי שורה ותגיות HTML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>כלי להמרת נתוני פרימיום מ-CSV ל-SQL</h2>
        <p>בחר את קובץ ה-CSV המכיל את נתוני הדוח העמוק, והמערכת תייצר עבורך קובץ SQL תקין ומוכן לטעינה ב-Supabase.</p>
        
        <input type="file" id="csvFile" accept=".csv">
        <br>
        <button onclick="convertCSV()">המר והורד קובץ SQL</button>
        <p class="note">הקוד מטפל אוטומטית בהמרת גרשיים (Escape) למניעת קריסות SQL.</p>
    </div>

    <script>
        function convertCSV() {
            const fileInput = document.getElementById('csvFile');
            if (!fileInput.files.length) {
                alert("אנא בחר קובץ CSV לפני לחיצה על המרה.");
                return;
            }

            Papa.parse(fileInput.files[0], {
                header: true,         // זיהוי שורת הכותרות (id, category, section_key, title, content)
                skipEmptyLines: true, // דילוג על שורות ריקות בסוף הקובץ
                complete: function(results) {
                    let sql = "-- סקריפט לטעינת נתוני דוח עמוק\n";
                    sql += "INSERT INTO deep_report_texts (category, section_key, title, content) VALUES\n";
                    
                    let values = [];
                    results.data.forEach(row => {
                        // טיפול הגנתי בגרשיים (' מוחלף ב- '') כדי להבטיח הכנסה חלקה למסד הנתונים
                        let category = (row.category || '').replace(/'/g, "''");
                        let section_key = (row.section_key || '').replace(/'/g, "''");
                        let title = (row.title || '').replace(/'/g, "''");
                        let content = (row.content || '').replace(/'/g, "''");
                        
                        values.push(`('${category}', '${section_key}', '${title}', '${content}')`);
                    });
                    
                    // חיבור כל השורות לפקודת INSERT אחת יעילה
                    sql += values.join(",\n") + ";\n";
                    downloadSQL(sql);
                }
            });
        }

        function downloadSQL(sqlContent) {
            const blob = new Blob([sqlContent], { type: 'text/sql;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "insert_deep_report.sql");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
