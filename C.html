<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הדוח המיסטי שלי</title>
    
    <!-- חיבור לקובץ ההגדרות (Manifest) כדי לאפשר התקנת PWA -->
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    
    <style>
        :root {
            --primary-color: #3498db;
            --primary-dark: #2980b9;
            --accent-color: #f39c12;
            --accent-dark: #d68910;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #ccd1d9;
            --ios-color: #007aff;
            --premium-color: #8e44ad;
            --premium-bg: #f5eef8;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); padding: 20px; line-height: 1.6; color: var(--text-color); }
        .container { max-width: 850px; margin: auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { text-align: center; color: var(--text-color); }
        
        /* עיצוב באנר ההתקנה */
        #installBanner {
            display: none;
            background-color: var(--accent-color);
            color: white;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.3s;
        }
        #installBanner:hover { background-color: var(--accent-dark); }

        /* עיצוב באנר הדרכה לאייפון (iOS) */
        #iosInstallBanner {
            display: none;
            background-color: var(--ios-color);
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; margin-bottom: 0; min-width: 0; position: relative; } 
        
        @media (max-width: 600px) {
            .form-row { flex-direction: column; gap: 15px; }
        }

        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary-color); font-size: 0.95em; transform: translateX(-2ch); }
        input { width: 100%; height: 38px; padding: 6px 12px; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 6px; font-size: 15px; background: #ffffff; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.04); text-align: right; transition: all 0.3s; }
        input:focus { border-color: var(--primary-color); box-shadow: inset 0 2px 4px rgba(0,0,0,0.04), 0 0 8px rgba(52, 152, 219, 0.3); outline: none; }

        .suggestions-box { position: absolute; top: 100%; right: 0; left: 0; background: #ffffff; border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 6px 6px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); z-index: 1000; max-height: 150px; overflow-y: auto; display: none; }
        .suggestion-item { padding: 8px 12px; cursor: pointer; font-size: 14px; text-align: right; border-bottom: 1px solid #f0f0f0; }
        .suggestion-item:hover { background-color: #ebf5fb; color: var(--primary-dark); }
        
        .action-buttons-top { display: flex; gap: 15px; margin-top: 25px; }
        .main-btn { background-color: var(--primary-color); color: white; flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; transition: background 0.3s;}
        .main-btn:hover { background-color: var(--primary-dark); }
        .main-btn:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        .premium-btn { background-color: var(--accent-color); color: white; flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; transition: background 0.3s;}
        .premium-btn:hover { background-color: var(--accent-dark); }
        .premium-btn:disabled { background-color: #f5cba7; cursor: not-allowed; }
        
        #results { margin-top: 30px; display: none; }
        #contentToPrint { background-color: #ffffff; padding: 20px; border: 2px solid #ecf0f1; border-radius: 8px; }
        #contentToPrint h2 { text-decoration: underline; text-underline-offset: 8px; margin-bottom: 25px;}
        
        .result-section { margin-bottom: 15px; }
        .result-item { background: #f7fbfe; padding: 15px; margin-bottom: 12px; border-radius: 6px; border-right: 5px solid #85c1e9; }
        .result-zodiac { background: #ebf5fb; border-right-color: var(--primary-color); }
        .result-date { background: #d4e6f1; border-right-color: #1b4f72; }
        
        .result-item h4 { margin: 0 0 8px 0; font-size: 1.1em; color: var(--text-color); }
        .result-item p { margin: 0 0 5px 0; color: #333; text-align: justify; }
        .light-text { color: #555 !important; }

        .actions { display: flex; gap: 15px; margin-top: 25px; }
        .whatsapp-btn { background-color: #25D366; color: white; flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;}
        .pdf-btn { background-color: #e74c3c; color: white; flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;}
        
        #loadingMsg { display: none; text-align: center; color: var(--primary-color); font-weight: bold; margin-top: 15px; font-size: 1.1em;}

        #networkStatus { text-align: center; font-size: 0.9em; padding: 5px; margin-bottom: 15px; border-radius: 4px; display: none; }
        .status-offline { background-color: #f8d7da; color: #721c24; display: block !important; }

        @media print {
            body { background-color: white; padding: 0; color: #000; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .form-row, h1, .action-buttons-top, .actions, #loadingMsg, #networkStatus, #installBanner, #iosInstallBanner { display: none !important; }
            #results { display: block !important; border: none; margin: 0; padding: 0; }
            #contentToPrint { border: none; padding: 0; background: white; }
            .result-item { page-break-inside: avoid; border-right: 4px solid #2c3e50 !important; background: #fdfdfd !important; padding: 12px; margin-bottom: 10px; box-shadow: none; text-align: justify; }
            h3, h4 { color: #000 !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="networkStatus">מצב אופליין: אין חיבור לאינטרנט. הפעולות נשמרות מקומית.</div>
        
        <div id="installBanner" onclick="installApp()">📲 התקן את האפליקציה על המכשיר שלך לחוויה מהירה ומושלמת</div>
        <div id="iosInstallBanner">🍏 להתקנת האפליקציה באייפון: לחץ על כפתור השיתוף (למטה) ובחר "הוסף למסך הבית"</div>
        
        <h1>הדוח המיסטי שלי</h1>
        
        <div class="form-row">
            <div class="form-group"><label>שם פרטי (חובה):</label><input type="text" id="firstName" autocomplete="given-name"></div>
            <div class="form-group"><label>שם פרטי נוסף (לא חובה):</label><input type="text" id="middleName" autocomplete="additional-name"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>שם משפחה (חובה):</label><input type="text" id="lastName" autocomplete="family-name"></div>
            <div class="form-group"><label>שם משפחה נוסף (לא חובה):</label><input type="text" id="extraLastName" autocomplete="off"></div>
        </div>

        <div class="form-row">
            <div class="form-group"><label>מספר טלפון נייד (חובה):</label><input type="tel" id="phone" autocomplete="tel"></div>
            <div class="form-group"><label>מספר תעודת זהות (לא חובה):</label><input type="text" id="idNumber" autocomplete="off"></div>
        </div>

        <div class="form-row">
            <div class="form-group"><label>תאריך לידה (חובה):</label><input type="date" id="birthDate" autocomplete="bday"></div>
            <div class="form-group"><label>שעת לידה (24 שעות):</label><input type="time" id="birthTime" value="12:00"></div>
            <div class="form-group">
                <label>עיר לידה (לא חובה):</label>
                <input type="text" id="city" value="ירושלים" autocomplete="off" oninput="fetchCitySuggestions(this.value)">
                <div id="citySuggestionsBox" class="suggestions-box"></div>
            </div>
        </div>

        <div class="action-buttons-top">
            <button id="calcBtn" class="main-btn" onclick="handleUserAction('basic_report')">הפק דוח בסיסי</button>
            <button class="premium-btn" onclick="handleUserAction('deep_report')">הפק דוח עמוק</button>
        </div>
        
        <div id="loadingMsg">מעבד נתונים מול כוכבי השמיים ומאגרי התאריכים... נא להמתין...</div>

        <div id="results">
            <div id="contentToPrint">
                <h2><span id="resName"></span> - דוח מיסטי</h2>
                <div class="result-section"><div id="resAstro"></div></div>
                <div class="result-section"><div id="resNamesNum"></div></div>
            </div>
            
            <div class="actions">
                <button class="whatsapp-btn" onclick="handleUserAction('whatsapp_share')">שלח דוח לוואטסאפ</button>
                <button class="pdf-btn" onclick="handleUserAction('pdf_download')">הורד דוח כ-PDF</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // מילוני נתונים (גיבוי אופליין / דוח בסיסי)
        // ==========================================
        const gematriaDict = {
            'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10,
            'כ':20,'ך':20,'ל':30,'מ':40,'ם':40,'נ':50,'ן':50,'ס':60,'ע':70,
            'פ':80,'ף':80,'צ':90,'ץ':90,'ק':100,'ר':200,'ש':300,'ת':400
        };

        let numerologyTexts = {
            1: "מנהיגות מולדת, עצמאות וכוח רצון עז. אנשי ה-1 הם חלוצים, יזמים ובעלי ביטחון עצמי גבוה.",
            2: "זוגיות, שותפות, דיפלומטיה ורגישות רגשית גבוהה. מגשרים טבעיים השואפים להרמוניה.",
            3: "ביטוי עצמי, יצירתיות, שמחת חיים וכריזמה מתפרצת. תקשורתיים ואופטימיים.",
            4: "יציבות, סדר, משמעת קפדנית ועבודה קשה. הבסיס האיתן שאפשר לסמוך עליו.",
            5: "חופש, הרפתקנות, תנועה מתמדת ושינויים. זקוקים למרחב נשימה ענק וגיוון.",
            6: "האהבה, המשפחתיות, ההרמוניה והשירות המסור לזולת. המטפלים והמגוננים.",
            7: "רוחניות, העמקה, חשיבה חקרנית ואינטואיציה חדה כתער. הוגי דעות וחוקרים.",
            8: "עוצמה, סמכות, שפע חומרי, סטאטוס והישגיות בקנה מידה גדול.",
            9: "הומניטריות, נתינה אוניברסלית ללא תנאי, אצילות נפש וסיום מעגלים."
        };

        let zodiacSigns = [
            { name: "טלה", desc: "מזל אש דינמי ויצרי. פורץ דרך, אמיץ ומוביל." },
            { name: "שור", desc: "מזל אדמה יציב ופרקטי. נאמן, חושני ואמין כסלע." },
            { name: "תאומים", desc: "מזל אוויר אינטלקטואלי ומהיר תפיסה. סקרן ותקשורתי." },
            { name: "סרטן", desc: "מזל מים רגשי, משפחתי ועמוק בעל אינטואיציה חזקה." },
            { name: "אריה", desc: "מזל אש מלכותי וזורח. כריזמטי, נדיב ובעל לב ענק." },
            { name: "בתולה", desc: "מזל אדמה מאורגן, אנליטי ויורד לפרטים הקטנים." },
            { name: "מאזניים", desc: "מזל אוויר אסתטי, דיפלומטי ושואף להרמוניה וצדק." },
            { name: "עקרב", desc: "מזל מים אינטנסיבי, מגנטי ובעל עוצמה נפשית אדירה." },
            { name: "קשת", desc: "מזל אש אופטימי, פילוסופי וחובב חופש והרפתקאות." },
            { name: "גדי", desc: "מזל אדמה שאפתן, מעשי, בוגר ואחראי לטווח רחוק." },
            { name: "דלי", desc: "מזל אוויר מקורי, אינדיבידואליסט והומניטרי." },
            { name: "דגים", desc: "מזל מים רוחני, חומל, אמנותי ובעל דמיון עשיר." }
        ];

        let ascendantTexts = {
            "טלה": "חזות נמרצת, ישירה ומהירה. כישרון ליזמות ופיקוד.",
            "שור": "נוכחות רגועה, שורשית ויציבה. כישרון לפיננסים ועיצוב.",
            "תאומים": "אנרגיה קלילה, תקשורתית וסקרנית. כישרון לתקשורת ותכנות.",
            "סרטן": "הילה רכה, מכילה ואמפתית. כישרון לטיפול ופסיכולוגיה.",
            "אריה": "נוכחות כריזמטית ומרשימה. כישרון לניהול ובמה.",
            "בתולה": "חזות רצינית, מסודרת ואנליטית. כישרון למדעים וארגון.",
            "מאזניים": "קסם אישי, נעימות ודיפלומטיה. כישרון לגישור ומשפטים.",
            "עקרב": "מבט חודר, עומק ומסתוריות. כישרון לחקירות וניתוח.",
            "קשת": "אופטימיות, פתיחות ושמחת חיים. כישרון להוראה ותיירות.",
            "גדי": "רושם סמכותי, בוגר ואחראי. כישרון לניהול מערכות גדולות.",
            "דלי": "מקוריות, חדשנות ועצמאות מחשבתית. כישרון להייטק.",
            "דגים": "עדינות, רגישות ורוחניות. כישרון לאמנות וטיפול."
        };

        let chineseZodiacTexts = {
            "קוף": "אינטליגנציה, סקרנות ושובבות. יכולת אלתור ופתרון בעיות יצירתי.",
            "תרנגול": "ביטחון עצמי, חריצות וסדר. נטייה לארגון, דייקנות ותשומת לב לפרטים.",
            "כלב": "נאמנות, צדק והגנה. חברות אמתית, כנות ורצון לעזור לזולת.",
            "חזיר": "טוב לב, כנות ושפע. אופי נדיב, סבלני ואוהב שלום והרמוניה.",
            "חולדה": "פיקחות, כושר הסתגלות וקסם אישי. מחשבה מהירה ויכולת הישרדות גבוהה.",
            "שור": "כוח, התמדה ואמינות. יציבות עמוקה, סבלנות ומוסר עבודה גבוה.",
            "נמר": "אומץ, תחרותיות ומנהיגות. אנרגיה דינמית, נועזות ורצון לפרוץ דרך.",
            "ארנב": "עדינות, אלגנטיות ורגישות. גישה דיפלומטית, נימוס וחיפוש אחר שלווה.",
            "דרקון": "כריזמה, כוח ומזל. שאפתנות גבוהה, נוכחות בולטת ויכולת הובלה.",
            "נחש": "חוכמה, אינטואיציה ומסתוריות. עומק מחשבתי, רגישות לסביבה ותכנון מוקפד.",
            "סוס": "מרץ, עצמאות ואהבת חופש. פעילות מתמדת, הרפתקנות ורוח חופשייה.",
            "עז": "יצירתיות, רוגע ואמפתיה. נשמה אמנותית, סבלנות והבנה רגשית עמוקה."
        };

        // ==========================================
        // פונקציות תשתית ותקשורת שרת
        // ==========================================
        async function fetchDynamicTexts() {
            if (!navigator.onLine || typeof supabaseClient === 'undefined') return;
            const COL_CATEGORY = 'category';     
            const COL_KEY_NAME = 'item_key';     
            const COL_TEXT_CONTENT = 'content'; 

            try {
                const { data, error } = await supabaseClient.from('dynamic_texts').select('*');
                if (error) return;
                
                if (data && data.length > 0) {
                    data.forEach(item => {
                        const category = item[COL_CATEGORY]; 
                        const key = item[COL_KEY_NAME];      
                        const content = item[COL_TEXT_CONTENT]; 

                        if (category === 'numerology' || category === 'נומרולוגיה') {
                            if (numerologyTexts[key]) numerologyTexts[key] = content;
                        } else if (category === 'zodiac' || category === 'מזלות') {
                            let zIndex = zodiacSigns.findIndex(z => z.name === key);
                            if (zIndex !== -1) zodiacSigns[zIndex].desc = content;
                        } else if (category === 'ascendant' || category === 'אופק') {
                            if (ascendantTexts[key]) ascendantTexts[key] = content;
                        } else if (category === 'chinese_zodiac' || category === 'מזל_סיני') {
                            if (chineseZodiacTexts[key]) chineseZodiacTexts[key] = content;
                        }
                    });
                }
            } catch (err) {}
        }

        function updateNetworkStatus() {
            const statusEl = document.getElementById('networkStatus');
            if (navigator.onLine) {
                statusEl.classList.remove('status-offline');
                syncOfflineLogs(); 
                fetchDynamicTexts(); 
            } else {
                statusEl.classList.add('status-offline');
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        async function syncOfflineLogs() {
            let offlineLogs = JSON.parse(localStorage.getItem('mysticOfflineLogs') || '[]');
            if (offlineLogs.length > 0 && navigator.onLine && typeof supabaseClient !== 'undefined') {
                try {
                    const { error } = await supabaseClient.from('reports_log').insert(offlineLogs);
                    if (!error) localStorage.removeItem('mysticOfflineLogs');
                } catch (err) {}
            }
        }

        async function writeToExperimentLog(actionType) {
            try {
                const now = new Date();
                const getFieldValue = (id) => { const el = document.getElementById(id); return el && el.value.trim() !== '' ? el.value.trim() : null; };

                let cityValue = getFieldValue('city');
                if (!cityValue) cityValue = "ירושלים";

                let logEntry = {
                    action_date: now.toISOString().split('T')[0],
                    action_time: now.toTimeString().split(' ')[0],
                    ip_address: await fetchUserIP(),
                    browser_info: navigator.userAgent,
                    action_type: actionType,
                    first_name: getFieldValue('firstName'),
                    middle_name: getFieldValue('middleName'),
                    last_name: getFieldValue('lastName'),
                    extra_last_name: getFieldValue('extraLastName'),
                    phone: getFieldValue('phone'),
                    id_number: getFieldValue('idNumber'),
                    birth_date: getFieldValue('birthDate'),
                    birth_time: getFieldValue('birthTime'),
                    city: cityValue
                };

                Object.keys(logEntry).forEach(key => { if (logEntry[key] === null) delete logEntry[key]; });

                if (navigator.onLine && typeof supabaseClient !== 'undefined') {
                    await supabaseClient.from('reports_log').insert([logEntry]);
                } else {
                    let offlineLogs = JSON.parse(localStorage.getItem('mysticOfflineLogs') || '[]');
                    offlineLogs.push(logEntry);
                    localStorage.setItem('mysticOfflineLogs', JSON.stringify(offlineLogs));
                }
            } catch (err) {}
        }

        async function fetchUserIP() {
            if (!navigator.onLine) return "Offline";
            try { return (await (await fetch('https://api.ipify.org?format=json')).json()).ip; } 
            catch { return "Unknown"; }
        }

        // ==========================================
        // פונקציות חישוב טהורות
        // ==========================================
        function calcGematria(word) {
            let sum = 0; if (!word) return 0;
            for (let i = 0; i < word.length; i++) { if (gematriaDict[word[i]]) sum += gematriaDict[word[i]]; }
            return sum;
        }

        function calcNumerology(number) {
            if (!number) return 0;
            let sum = number;
            while (sum > 9) {
                let temp = 0, str = sum.toString();
                for (let i = 0; i < str.length; i++) temp += parseInt(str[i]);
                sum = temp;
            }
            return sum;
        }

        function calcNumFromDigits(str) {
            let onlyNum = str.replace(/\D/g, '');
            let sum = 0;
            for (let i = 0; i < onlyNum.length; i++) sum += parseInt(onlyNum[i]);
            return sum;
        }

        function getZodiacIndex(day, month) {
            if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return 0;
            if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return 1;
            if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) return 2;
            if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) return 3;
            if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return 4;
            if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return 5;
            if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) return 6;
            if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) return 7;
            if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) return 8;
            if ((month == 12 && day >= 22) || (month == 1 && day <= 19)) return 9;
            if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return 10;
            return 11;
        }

        function calculateAscendant(sunSignIndex, birthTimeStr) {
            let parts = birthTimeStr.split(":");
            let decimalTime = parseInt(parts[0]) + (parseInt(parts[1]) / 60);
            let diff = decimalTime - 6;
            if (diff < 0) diff += 24;
            let offset = Math.floor(diff / 2);
            return zodiacSigns[(sunSignIndex + offset) % 12].name;
        }

                <div class="result-section" style="margin-top: 35px;">
                    <h3 style="color: var(--premium-color); border-bottom: 2px solid var(--premium-color); padding-bottom: 5px; text-align: right;">סוד האותיות: חוכמת ספר היצירה בשמך</h3>
                    <p style="margin-bottom: 15px; color: #555; text-align: right;">ניתוח מהותן של האותיות המרכיבות את שמך הפרטי ושם משפחתך, החושפות את כוחות הנפש הפנימיים שלך.</p>
                `;
                
                // 1. מחברים את השם הפרטי ושם המשפחה יחד
                let combinedNames = fName + lName;
                
                // 2. מנקים רווחים ותווים שאינם אותיות בעברית
                let cleanNames = combinedNames.replace(/[^א-ת]/g, ''); 
                
                // 3. מסננים כפילויות כדי לא להציג את אותה אות פעמיים
                let uniqueLetters = [...new Set(cleanNames.split(''))];
                
                // 4. מריצים את הלולאה על האותיות הייחודיות
                for (let i = 0; i < uniqueLetters.length; i++) {
                    let char = uniqueLetters[i];
                    let letterDesc = deepDict[char] || "אות זו נושאת תדר אנרגטי פנימי הייחודי לשורש נשמתך.";
                    
                    lettersHtml += `
                    <div class="result-item" style="border-right-color: var(--premium-color); background-color: #faf5fc; margin-bottom: 10px; padding: 12px;">
                        <h4 style="color: var(--premium-color); margin-bottom: 5px; font-size: 1.15em;">האות ${char}'</h4>
                        <p class="light-text" style="margin: 0; line-height: 1.6;">${letterDesc}</p>
                    </div>`;
                }
                lettersHtml += `</div>`;
                // ==========================================
                
                document.getElementById('resNamesNum').innerHTML = namesHtml + lettersHtml;
                document.getElementById('resName').innerText = `${fName} ${lName}`;
                document.getElementById('results').style.display = 'block';

            } catch (err) { alert("אירעה שגיאה בחישוב הנתונים: " + err.message); } 
            finally { 
                document.getElementById('calcBtn').disabled = false; 
                document.querySelector('.premium-btn').disabled = false;
                document.getElementById('loadingMsg').style.display = 'none'; 
            }
        }

        // ==========================================
        // פונקציית שיתוף לוואטסאפ
        // ==========================================
        function executeWhatsAppShare() {
            const phone = document.getElementById('phone').value.trim();
            if (!phone) return alert("אנא הזן מספר טלפון לשיתוף.");
            window.location.href = `whatsapp://send?phone=${phone.replace(/^0/, '972').replace(/\D/g, '')}&text=${encodeURIComponent(document.getElementById('contentToPrint').innerText)}`;
        }

        // ==========================================
        // PWA - רישום האפליקציה והתקנה
        // ==========================================
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
            });
        }

        let deferredPrompt;
        
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        const isInstalledLocally = localStorage.getItem('mysticAppInstalled') === 'true';

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); 
            deferredPrompt = e;
            
            if (!isStandalone && !isInstalledLocally) {
                document.getElementById('installBanner').style.display = 'block';
            }
        });

        async function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                
                if (outcome === 'accepted') {
                    console.log('המשתמש אישר את ההתקנה');
                    localStorage.setItem('mysticAppInstalled', 'true');
                }
                
                deferredPrompt = null; 
                document.getElementById('installBanner').style.display = 'none';
            }
        }

        window.addEventListener('appinstalled', (evt) => {
            console.log('ההתקנה הושלמה בהצלחה ברמת מערכת ההפעלה');
            localStorage.setItem('mysticAppInstalled', 'true');
            document.getElementById('installBanner').style.display = 'none';
        });

        const isIos = () => {
            const userAgent = window.navigator.userAgent.toLowerCase();
            return /iphone|ipad|ipod/.test(userAgent);
        };
        
        if (isIos() && !isStandalone && !isInstalledLocally) {
            document.getElementById('iosInstallBanner').style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', () => { updateNetworkStatus(); fetchDynamicTexts(); syncOfflineLogs(); });
    </script>
</body>
</html>
