<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- פקודות למניעת שמירה בזיכרון המטמון (Cache) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>דוח נתונים גולמיים (Raw Data) - מאובטח</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #bdc3c7;
            --excel-color: #27ae60;
            --danger-color: #e74c3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        /* הסתרת אזורי התצוגה כברירת מחדל עד לסיום בדיקת האבטחה */
        #unauthView, #secureDataView {
            display: none;
        }
        
        /* עיצוב למסך שגיאת התחברות */
        .unauth-container {
            max-width: 600px;
            text-align: center;
        }
        .unauth-container h1 {
            color: var(--danger-color);
            border-bottom: 2px solid var(--danger-color);
        }

        h1 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .nav-back {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }
        .nav-back:hover { text-decoration: underline; }
        
        .filters-section {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            background: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-weight: bold;
            color: var(--primary-color);
        }
        .form-group input[type="datetime-local"] {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 16px;
            font-family: inherit;
        }
        .action-btn {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            height: 42px;
            text-decoration: none;
            display: inline-block;
        }
        .action-btn:hover { background-color: #2980b9; }
        
        .export-btn {
            background-color: var(--excel-color);
            display: none;
        }
        .export-btn:hover { background-color: #2ecc71; }

        .table-responsive { overflow-x: auto; max-height: 600px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: right; border-bottom: 1px solid #ddd; white-space: nowrap; }
        th { background-color: var(--primary-color); color: white; position: sticky; top: 0; }
        tr:hover { background-color: #f5f5f5; }
        .loading { text-align: center; font-size: 18px; color: var(--accent-color); font-weight: bold; display: none; margin: 20px 0; }
    </style>
</head>
<body>

    <!-- מצב 1: משתמש לא מחובר או לא מורשה -->
    <div id="unauthView" class="container unauth-container">
        <h1>גישה נדחתה</h1>
        <p>אינך מחובר למערכת או שאין לך הרשאות לצפות בנתונים הגולמיים.</p>
        <p>יש להתחבר דרך מסך הניהול הראשי עם חשבון מורשה.</p>
        <br>
        <a href="admin.html" class="action-btn">מעבר למסך ההתחברות (ניהול ראשי)</a>
    </div>

    <!-- מצב 2: תצוגת הנתונים למשתמש מורשה -->
    <div id="secureDataView" class="container">
        <a href="admin.html" class="nav-back">← חזרה למסך הניהול הראשי</a>
        
        <h1>דוח נתונים גולמיים (Raw Data)</h1>

        <div class="filters-section">
            <div class="form-group">
                <label for="fromDate">מתאריך ושעה:</label>
                <input type="datetime-local" id="fromDate" step="1">
            </div>
            <div class="form-group">
                <label for="toDate">עד תאריך ושעה:</label>
                <input type="datetime-local" id="toDate" step="1">
            </div>
            <button class="action-btn" onclick="generateReport()">הפק דוח למסך</button>
            
            <button id="exportBtn" class="action-btn export-btn" onclick="exportToCSV()">ייצא ל-Sheets (CSV)</button>
        </div>

        <div id="loadingMsg" class="loading">טוען נתונים...</div>

        <div class="table-responsive">
            <table id="reportTable">
                <thead>
                    <tr>
                        <th>תאריך פעולה</th>
                        <th>סוג פעולה</th>
                        <th>IP</th>
                        <th>שם מלא</th>
                        <th>טלפון</th>
                        <th>ת.ז</th>
                        <th>עיר לידה</th>
                        <th>תאריך לידה</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // 1. הגדרות אבטחה
        const AUTHORIZED_EMAIL = '4990920@gmail.com';
        
        let currentReportData = [];

        // פונקציית אימות האבטחה
        async function checkAuthStatus() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session || session.user.email !== AUTHORIZED_EMAIL) {
                // המשתמש לא מחובר או שהאימייל אינו תואם למורשה - הצג שגיאה
                document.getElementById('unauthView').style.display = 'block';
                document.getElementById('secureDataView').style.display = 'none';
            } else {
                // המשתמש מורשה - חשיפת התוכן והפעלת המערכת
                document.getElementById('unauthView').style.display = 'none';
                document.getElementById('secureDataView').style.display = 'block';
                initDateFilters(); // קריאה לאתחול הטופס רק לאחר שווידאנו הרשאות
            }
        }

        // האזנה לשינויים בחיבור
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (!session || session.user.email !== AUTHORIZED_EMAIL) {
                document.getElementById('unauthView').style.display = 'block';
                document.getElementById('secureDataView').style.display = 'none';
            }
        });

        // 2. פונקציות הליבה של הדוח והייצוא
        function formatDateTimeLocal(dateObj) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            const hours = String(dateObj.getHours()).padStart(2, '0');
            const minutes = String(dateObj.getMinutes()).padStart(2, '0');
            const seconds = String(dateObj.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}:${seconds}`;
        }

        function formatCompactDateForFilename(dateString) {
            const d = new Date(dateString);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}${month}${year}`;
        }

        async function initDateFilters() {
            const toDate = new Date();
            toDate.setHours(23, 59, 59, 999);
            document.getElementById('toDate').value = formatDateTimeLocal(toDate);

            try {
                const { data, error } = await supabaseClient
                    .from('reports_log')
                    .select('created_at')
                    .order('created_at', { ascending: true })
                    .limit(1);

                let fromDate = new Date();
                if (data && data.length > 0 && data[0].created_at) {
                    fromDate = new Date(data[0].created_at);
                }
                fromDate.setHours(0, 0, 0, 0);
                document.getElementById('fromDate').value = formatDateTimeLocal(fromDate);
                
            } catch (err) {
                console.error("שגיאה:", err);
            }
        }

        async function generateReport() {
            const fromValue = document.getElementById('fromDate').value;
            const toValue = document.getElementById('toDate').value;

            if (!fromValue || !toValue) {
                alert("חובה להגדיר תאריך התחלה וסיום.");
                return;
            }

            const fromIso = new Date(fromValue).toISOString();
            const toIso = new Date(toValue).toISOString();

            document.getElementById('loadingMsg').style.display = 'block';
            document.getElementById('tableBody').innerHTML = '';
            document.getElementById('exportBtn').style.display = 'none';

            try {
                const { data, error } = await supabaseClient
                    .rpc('get_full_log')
                    .gte('created_at', fromIso)
                    .lte('created_at', toIso);

                if (error) throw error;
                
                currentReportData = data;
                renderTable(data);

                if (data && data.length > 0) {
                    document.getElementById('exportBtn').style.display = 'inline-block';
                }

            } catch (err) {
                console.error("שגיאה בהפקת הדוח:", err);
            } finally {
                document.getElementById('loadingMsg').style.display = 'none';
            }
        }

        function renderTable(dataArray) {
            const tbody = document.getElementById('tableBody');
            if (!dataArray || dataArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">לא נמצאו רשומות בטווח התאריכים הנבחר.</td></tr>';
                return;
            }

            let htmlContent = '';
            dataArray.forEach(row => {
                const sysDate = new Date(row.created_at).toLocaleString('he-IL');
                const fullName = `${row.first_name || ''} ${row.last_name || ''}`.trim();
                const phone = row.phone || '-';
                const idNum = row.id_number || '-';
                const city = row.city || '-';
                const birthVal = row.birth_date ? `${row.birth_date} ${row.birth_time || ''}` : '-';

                htmlContent += `
                    <tr>
                        <td dir="ltr">${sysDate}</td>
                        <td>${row.action_type}</td>
                        <td dir="ltr">${row.ip_address}</td>
                        <td>${fullName}</td>
                        <td>${phone}</td>
                        <td>${idNum}</td>
                        <td>${city}</td>
                        <td dir="ltr">${birthVal}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = htmlContent;
        }

        function exportToCSV() {
            if (!currentReportData || currentReportData.length === 0) {
                alert("אין נתונים לייצוא.");
                return;
            }

            const headers = Object.keys(currentReportData[0]);
            let csvContent = "\uFEFF" + headers.join(",") + "\n";

            currentReportData.forEach(row => {
                let rowData = headers.map(header => {
                    let cellValue = row[header] === null || row[header] === undefined ? "" : String(row[header]);
                    cellValue = cellValue.replace(/"/g, '""');
                    return `"${cellValue}"`;
                });
                csvContent += rowData.join(",") + "\n";
            });

            const fromValue = document.getElementById('fromDate').value;
            const toValue = document.getElementById('toDate').value;
            const fromStr = formatCompactDateForFilename(fromValue);
            const toStr = formatCompactDateForFilename(toValue);
            const filename = `rawdata-${fromStr}-${toStr}.csv`;

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // הפעלת בדיקת האבטחה (ורק אחריה אתחול הנתונים) בעת טעינת הדף
        window.addEventListener('DOMContentLoaded', () => {
            checkAuthStatus();
        });
    </script>
</body>
</html>
