<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <title>דוח נתונים גולמיים (Raw Data) - מאובטח ודינמי</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        :root { --primary-color: #2c3e50; --accent-color: #3498db; --bg-color: #f4f7f6; --card-bg: #ffffff; --border-color: #bdc3c7; --excel-color: #27ae60; --danger-color: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 95%; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        #unauthView, #secureDataView { display: none; }
        .unauth-container { max-width: 600px; text-align: center; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; margin-bottom: 20px; }
        .nav-back { display: inline-block; margin-bottom: 20px; color: var(--accent-color); text-decoration: none; font-weight: bold; }
        
        .filters-section { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; background: #ecf0f1; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-weight: bold; color: var(--primary-color); }
        .form-group input { padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 16px; }
        .action-btn { background-color: var(--accent-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .action-btn:hover { background-color: #2980b9; }
        .export-btn { background-color: var(--excel-color); display: none; }
        
        .table-responsive { overflow-x: auto; max-height: 600px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: right; border-bottom: 1px solid #ddd; white-space: nowrap; }
        th { background-color: var(--primary-color); color: white; position: sticky; top: 0; }
        tr:hover { background-color: #f5f5f5; }
        #loadingMsg { display: none; text-align: center; font-weight: bold; margin: 20px 0; color: var(--accent-color); }
    </style>
</head>
<body>

    <div id="unauthView" class="container unauth-container">
        <h1>גישה נדחתה</h1>
        <a href="admin.html" class="action-btn">מעבר למסך ההתחברות</a>
    </div>

    <div id="secureDataView" class="container">
        <a href="admin.html" class="nav-back">← חזרה למסך הניהול הראשי</a>
        <h1>דוח נתונים גולמיים דינמי</h1>

        <div class="filters-section">
            <div class="form-group"><label>מתאריך ושעה:</label><input type="datetime-local" id="fromDate" step="1"></div>
            <div class="form-group"><label>עד תאריך ושעה:</label><input type="datetime-local" id="toDate" step="1"></div>
            <button class="action-btn" onclick="generateReport()">הפק דוח למסך</button>
            <button id="exportBtn" class="action-btn export-btn" onclick="exportToCSV()">ייצא ל-Sheets</button>
        </div>

        <div id="loadingMsg">מושך נתונים מהשרת, אנא המתן...</div>

        <div class="table-responsive">
            <table id="reportTable">
                <!-- כותרות הטבלה ייבנו כעת באופן אוטומטי מהקוד -->
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const AUTHORIZED_EMAIL = '4990920@gmail.com';
        let currentReportData = [];

        // [הערת מתחזק: מילון תרגום משמות עמודות ה-DB לכותרות עבריות. 
        // במידה ונוספת עמודה ל-Supabase, פשוט הוסף את התרגום שלה כאן והיא תופיע אוטומטית בדוח!]
        const columnTranslations = {
            'id': 'מזהה רשומה',
            'created_at': 'זמן רישום במערכת',
            'action_date': 'תאריך הפעולה',
            'action_time': 'שעת הפעולה',
            'ip_address': 'כתובת IP',
            'browser_info': 'פרטי דפדפן',
            'action_type': 'סוג פעולה',
            'first_name': 'שם פרטי',
            'middle_name': 'שם אמצעי',
            'last_name': 'שם משפחה',
            'extra_last_name': 'שם משפחה נוסף',
            'phone': 'טלפון',
            'id_number': 'תעודת זהות',
            'birth_date': 'תאריך לידה',
            'birth_time': 'שעת לידה',
            'city': 'עיר'
        };

        async function checkAuthStatus() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session || session.user.email !== AUTHORIZED_EMAIL) {
                document.getElementById('unauthView').style.display = 'block';
            } else {
                document.getElementById('secureDataView').style.display = 'block';
                initDateFilters();
            }
        }

        // הגדרת תאריכי חיפוש
        function formatDateTimeLocal(dateObj) {
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}T${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}:${String(dateObj.getSeconds()).padStart(2, '0')}`;
        }

        async function initDateFilters() {
            const toDate = new Date(); toDate.setHours(23, 59, 59, 999);
            document.getElementById('toDate').value = formatDateTimeLocal(toDate);
            let fromDate = new Date(); fromDate.setHours(0, 0, 0, 0);
            try {
                const { data } = await supabaseClient.from('reports_log').select('created_at').order('created_at', { ascending: true }).limit(1);
                if (data && data.length > 0 && data[0].created_at) fromDate = new Date(data[0].created_at);
                fromDate.setHours(0, 0, 0, 0);
            } catch (err) {}
            document.getElementById('fromDate').value = formatDateTimeLocal(fromDate);
        }

        // ==========================================
        // מודול בניית הטבלה הדינמית
        // ==========================================
        async function generateReport() {
            const fromIso = new Date(document.getElementById('fromDate').value).toISOString();
            const toIso = new Date(document.getElementById('toDate').value).toISOString();
            
            document.getElementById('loadingMsg').style.display = 'block';
            document.getElementById('tableHead').innerHTML = '';
            document.getElementById('tableBody').innerHTML = '';
            document.getElementById('exportBtn').style.display = 'none';

            try {
                const { data, error } = await supabaseClient.rpc('get_full_log').gte('created_at', fromIso).lte('created_at', toIso);
                if (error) throw error;
                currentReportData = data;
                renderDynamicTable(data);
                if (data && data.length > 0) document.getElementById('exportBtn').style.display = 'inline-block';
            } catch (err) { alert("שגיאה במשיכת הנתונים."); }
            finally { document.getElementById('loadingMsg').style.display = 'none'; }
        }

        function renderDynamicTable(dataArray) {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            
            if (!dataArray || dataArray.length === 0) {
                tbody.innerHTML = '<tr><td style="text-align: center;">לא נמצאו רשומות.</td></tr>';
                return;
            }

            // חילוץ שמות העמודות (מפתחות) מהרשומה הראשונה
            const keys = Object.keys(dataArray[0]);

            // בניית שורת הכותרת (Thead) בעזרת מילון התרגום
            let headRow = '<tr>';
            keys.forEach(key => {
                // אם המפתח קיים במילון - נשתמש בעברית. אחרת, נציג אותו כמו שהוא במקור.
                const translatedHeader = columnTranslations[key] || key;
                headRow += `<th>${translatedHeader}</th>`;
            });
            headRow += '</tr>';
            thead.innerHTML = headRow;

            // בניית גוף הטבלה (Tbody)
            let bodyContent = '';
            dataArray.forEach(row => {
                bodyContent += '<tr>';
                keys.forEach(key => {
                    let cellValue = row[key];
                    if (cellValue === null || cellValue === undefined) cellValue = '-';
                    // עיצוב תאריכים למראה קריא וישור לשמאל עבור שדות באנגלית
                    if (key === 'created_at') cellValue = new Date(cellValue).toLocaleString('he-IL');
                    let isLtr = ['ip_address', 'created_at', 'birth_date', 'action_date'].includes(key);
                    bodyContent += `<td ${isLtr ? 'dir="ltr"' : ''}>${cellValue}</td>`;
                });
                bodyContent += '</tr>';
            });
            tbody.innerHTML = bodyContent;
        }

        // ==========================================
        // ייצוא דינמי ל-CSV
        // ==========================================
        function exportToCSV() {
            if (!currentReportData || currentReportData.length === 0) return;
            const keys = Object.keys(currentReportData[0]);
            
            // שימוש במילון התרגום גם לשורת הכותרות בקובץ האקסל
            const translatedHeaders = keys.map(key => columnTranslations[key] || key);
            let csvContent = "\uFEFF" + translatedHeaders.join(",") + "\n";

            currentReportData.forEach(row => {
                let rowData = keys.map(key => {
                    let val = row[key] === null || row[key] === undefined ? "" : String(row[key]);
                    return `"${val.replace(/"/g, '""')}"`;
                });
                csvContent += rowData.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `rawdata-export.csv`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        window.addEventListener('DOMContentLoaded', () => checkAuthStatus());
    </script>
</body>
</html>
